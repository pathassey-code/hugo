const clouds = Array.from({ length: 7 }, (_, i) => ({ x: i * 200 + Math.random() * 120, y: 35 + Math.random() * 120, s: 0.6 + Math.random() * 0.7 }));

function drawSky(camX) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, theme.sky[0]);
  g.addColorStop(0.55, theme.sky[1]);
  g.addColorStop(1, theme.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (theme.sun) {
    const sx = 770, sy = 92;
    const sg = ctx.createRadialGradient(sx, sy, 8, sx, sy, 180);
    sg.addColorStop(0, 'rgba(255, 252, 230, 1)');
    sg.addColorStop(0.16, theme.sun + ' 0.95)');
    sg.addColorStop(0.17, theme.sun + ' 0.45)');
    sg.addColorStop(1, theme.sun + ' 0)');
    ctx.fillStyle = sg;
    ctx.fillRect(sx - 180, sy - 180, 360, 360);
  }
  if (theme.fuji) {
    // a snow-capped mountain far away
    const fx = ((620 - camX * 0.03) % 1800 + 1800) % 1800 - 300;
    ctx.fillStyle = '#9a9cc4';
    ctx.beginPath(); ctx.moveTo(fx - 330, 400); ctx.lineTo(fx - 60, 150); ctx.lineTo(fx + 60, 150); ctx.lineTo(fx + 330, 400); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(fx - 60, 150); ctx.lineTo(fx + 60, 150); ctx.lineTo(fx + 118, 205);
    ctx.lineTo(fx + 80, 196); ctx.lineTo(fx + 55, 214); ctx.lineTo(fx + 25, 196); ctx.lineTo(fx, 216);
    ctx.lineTo(fx - 28, 196); ctx.lineTo(fx - 58, 212); ctx.lineTo(fx - 82, 196); ctx.lineTo(fx - 118, 205);
    ctx.closePath(); ctx.fill();
  }
  if (def.theme === 'cave') {
    // distant glowing crystals in the dark
    for (let i = 0; i < 9; i++) {
      const x = ((i * 157 - camX * 0.05) % (W + 100) + W + 100) % (W + 100) - 50;
      glow(x, 140 + (i * 53) % 160, 50 + (i % 3) * 20, `rgba(${120 + i * 10}, 90, 255, 0.18)`);
    }
  }
  if (theme.volcano) {
    // a distant erupting volcano
    const vx = 640 - (camX * 0.04) % 1400;
    for (const x of [vx, vx + 1400]) {
      ctx.fillStyle = '#2a0e0c';
      ctx.beginPath(); ctx.moveTo(x - 260, 380); ctx.lineTo(x - 50, 170); ctx.lineTo(x + 50, 170); ctx.lineTo(x + 260, 380); ctx.closePath(); ctx.fill();
      glow(x, 170, 120, `rgba(255, 120, 40, ${0.45 + 0.15 * Math.sin(time * 3)})`);
      ctx.fillStyle = 'rgba(60, 30, 30, 0.5)';
      for (let k = 0; k < 4; k++) circle(x + Math.sin(time * 0.5 + k) * 30 + k * 15, 130 - k * 28 - (time * 6 % 28), 26 + k * 8);
    }
  }
}

function drawRays(camX) {
  if (!theme.rays) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const shift = (camX * 0.05) % 340;
  for (let i = -1; i < 5; i++) {
    const x0 = 160 + i * 170 - shift;
    ctx.fillStyle = `rgba(255, 240, 200, ${0.035 + 0.015 * Math.sin(time * 0.7 + i)})`;
    ctx.beginPath();
    ctx.moveTo(x0, 0); ctx.lineTo(x0 + 55, 0); ctx.lineTo(x0 - 120, H); ctx.lineTo(x0 - 260, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawCloud(x, y, s) {
  const puffs = [[0, 0, 30], [30, -14, 36], [64, -2, 30], [34, 8, 30], [92, 6, 22]];
  ctx.fillStyle = 'rgba(190, 215, 240, 0.6)';
  for (const [px, py, r] of puffs) circle(x + px * s, y + py * s + 7 * s, r * s);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  for (const [px, py, r] of puffs) circle(x + px * s, y + py * s, r * s);
}

function drawClouds(camX) {
  if (!theme.sun) return;
  const span = W + 400;
  for (const c of clouds) {
    const x = ((c.x - camX * 0.06 - time * 8) % span + span) % span - 200;
    drawCloud(x, c.y, c.s);
  }
}

function ridge(camX, factor, baseY, amp, color, seed, sharp = false) {
  const off = camX * factor;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) {
    const wx = (x + off) * 0.004 + seed;
    let v = 0.5 + 0.35 * Math.sin(wx) + 0.2 * Math.sin(wx * 2.3 + 1.7) + 0.1 * Math.sin(wx * 5.1 + 0.3);
    if (sharp) v = 0.3 + Math.abs(Math.sin(wx * 1.3)) * 0.7 + 0.08 * Math.sin(wx * 7);
    ctx.lineTo(x, baseY - amp * v);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawPalm(x, y, h, lean) {
  const tx = x + lean * h, ty = y - h;
  ctx.strokeStyle = theme.trunk;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + lean * h * 0.2, y - h * 0.6, tx, ty); ctx.stroke();
  ctx.fillStyle = theme.leaf;
  for (let k = 0; k < 7; k++) {
    const a = -Math.PI + k * (Math.PI / 6) + Math.sin(time * 1.2 + x * 0.01 + k) * 0.05;
    const L = 58 + (k % 2) * 10;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(L * 0.5, -16, L, 12); ctx.quadraticCurveTo(L * 0.45, 2, 0, 0); ctx.fill();
    ctx.restore();
  }
}

function drawPine(x, y, h) {
  ctx.fillStyle = theme.trunk;
  ctx.fillRect(x - 5, y - h * 0.25, 10, h * 0.25);
  for (let i = 0; i < 3; i++) {
    const w = h * (0.42 - i * 0.1), by = y - h * 0.2 - i * h * 0.25;
    ctx.fillStyle = theme.leaf;
    ctx.beginPath(); ctx.moveTo(x - w, by); ctx.lineTo(x, by - h * 0.38); ctx.lineTo(x + w, by); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.beginPath(); ctx.moveTo(x - w * 0.45, by - h * 0.2); ctx.lineTo(x, by - h * 0.38); ctx.lineTo(x + w * 0.45, by - h * 0.2);
    ctx.quadraticCurveTo(x, by - h * 0.16, x - w * 0.45, by - h * 0.2); ctx.fill();
  }
}

function drawCrystalCluster(x, y, h) {
  glow(x, y - h * 0.5, h * 0.9, 'rgba(123, 92, 255, 0.25)');
  for (let i = -2; i <= 2; i++) {
    const ch = h * (1 - Math.abs(i) * 0.25), cw = 12;
    const g = ctx.createLinearGradient(x + i * 14, y - ch, x + i * 14 + cw, y);
    g.addColorStop(0, '#d0c4ff'); g.addColorStop(1, '#5a3fd6');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + i * 14 - cw / 2, y); ctx.lineTo(x + i * 14 - cw / 2 + i * 3, y - ch * 0.8);
    ctx.lineTo(x + i * 14 + i * 4, y - ch); ctx.lineTo(x + i * 14 + cw / 2 + i * 3, y - ch * 0.8); ctx.lineTo(x + i * 14 + cw / 2, y);
    ctx.closePath(); ctx.fill();
  }
}

function drawDeadTree(x, y, h) {
  ctx.strokeStyle = theme.trunk;
  ctx.lineCap = 'round';
  const branch = (bx, by, len, ang, w) => {
    if (len < 10) return;
    const ex = bx + Math.cos(ang) * len, ey = by + Math.sin(ang) * len;
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
    branch(ex, ey, len * 0.65, ang - 0.5, w * 0.65);
    branch(ex, ey, len * 0.6, ang + 0.45, w * 0.6);
  };
  branch(x, y, h * 0.45, -Math.PI / 2, 9);
}

function drawSakura(x, y, h) {
  ctx.strokeStyle = theme.trunk;
  ctx.lineCap = 'round';
  ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 6, y - h * 0.4, x + 4, y - h * 0.6); ctx.stroke();
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x + 2, y - h * 0.5); ctx.lineTo(x - h * 0.3, y - h * 0.75);
  ctx.moveTo(x + 4, y - h * 0.55); ctx.lineTo(x + h * 0.32, y - h * 0.78);
  ctx.stroke();
  const blobs = [[0, -0.75, 0.3], [-0.3, -0.72, 0.24], [0.32, -0.74, 0.25], [-0.15, -0.92, 0.22], [0.18, -0.9, 0.22]];
  ctx.fillStyle = '#ff9fb8';
  for (const [bx, by, r] of blobs) circle(x + bx * h, y + by * h + 4, r * h);
  ctx.fillStyle = '#ffc8d6';
  for (const [bx, by, r] of blobs) circle(x + bx * h - 3, y + by * h - 2, r * h * 0.8);
}

function drawPagoda(x, y, h) {
  ctx.fillStyle = 'rgba(110, 60, 80, 0.85)';
  for (let i = 0; i < 4; i++) {
    const w = h * (0.32 - i * 0.05), by = y - i * h * 0.22;
    ctx.fillRect(x - w * 0.6, by - h * 0.16, w * 1.2, h * 0.16);
    ctx.beginPath();
    ctx.moveTo(x - w - 10, by - h * 0.15); ctx.quadraticCurveTo(x, by - h * 0.24, x + w + 10, by - h * 0.15);
    ctx.lineTo(x + w * 0.7, by - h * 0.21); ctx.lineTo(x - w * 0.7, by - h * 0.21);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillRect(x - 2, y - h * 1.05, 4, h * 0.2);
}

function drawSaguaro(x, y, h, c = theme.trunk) {
  ctx.strokeStyle = c;
  ctx.lineCap = 'round';
  ctx.lineWidth = h * 0.13;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x, y - h);
  ctx.moveTo(x, y - h * 0.45); ctx.lineTo(x - h * 0.22, y - h * 0.45); ctx.lineTo(x - h * 0.22, y - h * 0.75);
  ctx.moveTo(x, y - h * 0.6); ctx.lineTo(x + h * 0.2, y - h * 0.6); ctx.lineTo(x + h * 0.2, y - h * 0.85);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.lineWidth = h * 0.03;
  ctx.beginPath(); ctx.moveTo(x - h * 0.02, y); ctx.lineTo(x - h * 0.02, y - h); ctx.stroke();
}

function drawPyramid(x, y, h) {
  ctx.fillStyle = 'rgba(170, 110, 70, 0.8)';
  for (let i = 0; i < 5; i++) {
    const w = h * (0.9 - i * 0.15), sh = h * 0.16;
    ctx.fillRect(x - w, y - (i + 1) * sh, w * 2, sh + 1);
  }
  ctx.fillRect(x - h * 0.12, y - h * 0.95, h * 0.24, h * 0.16);
  ctx.fillStyle = 'rgba(120, 70, 40, 0.8)';
  ctx.fillRect(x - h * 0.06, y - h * 0.8, h * 0.12, h * 0.8);
}

function drawTrees(camX) {
  const f = 0.55, spacing = 230, off = camX * f;
  const i0 = Math.floor((off - 250) / spacing), i1 = Math.floor((off + W + 250) / spacing);
  for (let i = i0; i <= i1; i++) {
    const r = mulberry32(i * 977 + 13);
    const x = i * spacing - off + r() * 80, h = 120 + r() * 90, lean = r() * 0.4 - 0.2;
    if (theme.trees === 'palm') drawPalm(x, 452, h, lean);
    else if (theme.trees === 'pine') drawPine(x, 455, h * 0.9);
    else if (theme.trees === 'crystal') drawCrystalCluster(x, 452, h * 0.45);
    else if (theme.trees === 'sakura') { if (i % 4 === 0) drawPagoda(x, 455, h * 1.1); else drawSakura(x, 455, h * 0.9); }
    else if (theme.trees === 'cactus') { if (i % 5 === 0) drawPyramid(x, 455, h * 0.9); else drawSaguaro(x, 455, h * 0.75); }
    else drawDeadTree(x, 455, h);
  }
}

function drawBackground(camX) {
  drawSky(camX);
  drawRays(camX);
  drawClouds(camX);
  const sharp = def.theme === 'snow' || def.theme === 'volcano';
  ridge(camX, 0.1, 330, 160, theme.ridges[0], 0, sharp);
  ridge(camX, 0.22, 370, 130, theme.ridges[1], 3, sharp);
  const mist = ctx.createLinearGradient(0, 300, 0, 420);
  mist.addColorStop(0, 'rgba(0, 0, 0, 0)');
  mist.addColorStop(1, theme.mist);
  ctx.fillStyle = mist;
  ctx.fillRect(0, 300, W, 120);
  ridge(camX, 0.38, 420, 85, theme.ridges[2], 5);
  drawTrees(camX);
  ctx.fillStyle = theme.floor;
  ctx.fillRect(0, 448, W, H - 448);
}

function drawLiquid(camX) {
  const wy = H - 38;
  const wave = x => wy + Math.sin((x + camX) * 0.03 + time * (theme.lava ? 1.2 : 2)) * 3;
  if (theme.lava) glow(W / 2, H, W * 0.6, 'rgba(255, 100, 30, 0.25)');
  const g = ctx.createLinearGradient(0, wy, 0, H);
  g.addColorStop(0, theme.liquid[0]);
  g.addColorStop(1, theme.liquid[1]);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, wave(x));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = theme.lava ? 'rgba(255, 240, 180, 0.8)' : 'rgba(255, 255, 255, 0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W + 12; x += 12) { if (x === 0) ctx.moveTo(x, wave(x)); else ctx.lineTo(x, wave(x)); }
  ctx.stroke();
  if (theme.lava) {
    for (let i = 0; i < 6; i++) {
      const bx = ((i * 173 + time * 20 - camX) % W + W) % W, ph = (time * 0.8 + i * 0.37) % 1;
      ctx.fillStyle = `rgba(255, 220, 120, ${1 - ph})`;
      circle(bx, wy + 6 - ph * 10, 3 + ph * 4);
    }
  }
}

// ===========================================================================
// World drawing
// ===========================================================================
function drawTiles(camX) {
  const tiles = tilesFor(theme);
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(COLS - 1, Math.floor((camX + W) / T));
  for (let c = c0; c <= c1; c++) {
    const x = Math.round(c * T - camX);
    const groundTop = ROWS - heights[c];
    for (let r = 0; r < ROWS; r++) {
      const t = grid[r][c];
      if (!t) continue;
      const y = r * T;
      if (t === 2) { ctx.drawImage(tiles.ledge, x, y); continue; }
      const isSurface = r === groundTop;
      ctx.drawImage(isSurface ? tiles.top[(c * 7) % 3] : tiles.dirt[(c * 5 + r * 3) % 3], x, y);
      const depth = r >= groundTop ? r - groundTop : ceil[c] - 1 - r;
      if (depth > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(0.5, depth * 0.14)})`;
        ctx.fillRect(x, y, T, T);
      }
      if (r < groundTop && r === ceil[c] - 1) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(x, y + T - 6, T, 6);
      }
      const skip = isSurface ? theme.topH - 2 : 0;
      if (tileAt(r, c - 1) !== 1) {
        const g = ctx.createLinearGradient(x, 0, x + 10, 0);
        g.addColorStop(0, 'rgba(0, 0, 0, 0.35)'); g.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = g; ctx.fillRect(x, y + skip, 10, T - skip);
      }
      if (tileAt(r, c + 1) !== 1) {
        const g = ctx.createLinearGradient(x + T - 10, 0, x + T, 0);
        g.addColorStop(0, 'rgba(0, 0, 0, 0)'); g.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
        ctx.fillStyle = g; ctx.fillRect(x + T - 10, y + skip, 10, T - skip);
      }
    }
  }
  for (const m of movers) {
    const x = Math.round(m.x - camX);
    if (x < -m.w || x > W) continue;
    for (let i = 0; i < m.w; i += T) ctx.drawImage(tiles.ledge, x + i, m.y);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    circle(x + 6, m.y + 11, 2.5);
    circle(x + m.w - 6, m.y + 11, 2.5);
  }
}

function drawHangers(camX) {
  for (const s of hangers) {
    const x = s.x - camX;
    if (x < -20 || x > W + 20) continue;
    const g = ctx.createLinearGradient(x, s.y, x, s.y + s.len);
    g.addColorStop(0, theme.dirt[1]); g.addColorStop(1, '#8f7fc0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x - 6, s.y); ctx.lineTo(x + 6, s.y); ctx.lineTo(x, s.y + s.len); ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(155, 246, 255, ${0.5 + 0.4 * Math.sin(time * 2 + s.x)})`;
    circle(x, s.y + s.len - 2, 1.8);
  }
}

function drawDecor(camX) {
  for (const d of decor) {
    const x = d.x - camX;
    if (x < -40 || x > W + 40) continue;
    const y = d.y, s = d.s;
    switch (d.kind) {
      case 'tuft':
        ctx.strokeStyle = '#4fae38'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let i = -2; i <= 2; i++) {
          const sway = Math.sin(time * 2 + d.x * 0.05 + i) * 2;
          ctx.beginPath(); ctx.moveTo(x + i * 3, y + 2);
          ctx.quadraticCurveTo(x + i * 4, y - 6 * s, x + i * 5 + sway, y - (10 - Math.abs(i) * 1.5) * s);
          ctx.stroke();
        }
        break;
      case 'flower':
        ctx.strokeStyle = '#3f9b2f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, y - 12); ctx.stroke();
        ctx.fillStyle = d.color;
        for (let i = 0; i < 5; i++) circle(x + Math.cos(i * 1.26 + time) * 4, y - 14 + Math.sin(i * 1.26 + time) * 4, 3);
        ctx.fillStyle = '#ffe066'; circle(x, y - 14, 2.4);
        break;
      case 'rock':
        ctx.fillStyle = def.theme === 'volcano' ? '#3a2b28' : '#8a8172'; ellipse(x, y - 4 * s, 10 * s, 7 * s);
        ctx.fillStyle = def.theme === 'snow' ? '#ffffff' : 'rgba(255, 255, 255, 0.3)'; ellipse(x - 2 * s, y - 8 * s, 6 * s, 2.5 * s);
        break;
      case 'mushroom':
        ctx.fillStyle = '#f1e3c8'; ctx.fillRect(x - 2, y - 9, 4, 10);
        ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(x, y - 9, 7, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#fff'; circle(x - 3, y - 12, 1.5); circle(x + 3, y - 11, 1.2);
        break;
      case 'crystal': {
        glow(x, y - 10 * s, 26 * s, 'rgba(155, 246, 255, 0.35)');
        const g = ctx.createLinearGradient(x - 6, y - 22 * s, x + 6, y);
        g.addColorStop(0, '#e0fbff'); g.addColorStop(1, '#3a86ff');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(x - 6 * s, y); ctx.lineTo(x - 3 * s, y - 18 * s); ctx.lineTo(x + 1 * s, y - 24 * s); ctx.lineTo(x + 5 * s, y - 15 * s); ctx.lineTo(x + 6 * s, y); ctx.closePath(); ctx.fill();
        break;
      }
      case 'glowshroom':
        glow(x, y - 10, 22, 'rgba(110, 240, 212, 0.35)');
        ctx.fillStyle = '#d8fff6'; ctx.fillRect(x - 2, y - 9, 4, 10);
        ctx.fillStyle = '#6ef0d4'; ctx.beginPath(); ctx.arc(x, y - 9, 8, Math.PI, 0); ctx.fill();
        break;
      case 'snowtuft':
        ctx.fillStyle = '#ffffff'; ellipse(x, y - 2, 14 * s, 6 * s);
        ctx.fillStyle = '#e1ecf7'; ellipse(x + 4, y, 10 * s, 4 * s);
        break;
      case 'icicle':
        glow(x, y - 10, 20, 'rgba(200, 240, 255, 0.35)');
        ctx.fillStyle = '#c8ecff';
        ctx.beginPath(); ctx.moveTo(x - 5 * s, y); ctx.lineTo(x, y - 20 * s); ctx.lineTo(x + 5 * s, y); ctx.closePath(); ctx.fill();
        break;
      case 'sapling':
        ctx.fillStyle = '#2e5e4e';
        ctx.beginPath(); ctx.moveTo(x - 9 * s, y); ctx.lineTo(x, y - 24 * s); ctx.lineTo(x + 9 * s, y); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ellipse(x, y - 16 * s, 4 * s, 2 * s);
        break;
      case 'flame': {
        const f = Math.sin(time * 14 + d.x) * 2;
        glow(x, y - 8, 24, 'rgba(255, 140, 40, 0.4)');
        ctx.fillStyle = '#ff6b35';
        ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.quadraticCurveTo(x - 7, y - 10, x + f, y - 18 * s); ctx.quadraticCurveTo(x + 7, y - 10, x + 6, y); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.moveTo(x - 3, y); ctx.quadraticCurveTo(x - 3, y - 6, x + f * 0.5, y - 10 * s); ctx.quadraticCurveTo(x + 3, y - 6, x + 3, y); ctx.closePath(); ctx.fill();
        break;
      }
      case 'pinkflower':
        ctx.strokeStyle = '#3f9b2f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, y - 12); ctx.stroke();
        ctx.fillStyle = '#ffb7c5';
        for (let i = 0; i < 5; i++) circle(x + Math.cos(i * 1.26) * 4, y - 14 + Math.sin(i * 1.26) * 4, 3);
        ctx.fillStyle = '#ffe066'; circle(x, y - 14, 2);
        break;
      case 'lantern':
        ctx.fillStyle = '#9a958c';
        ctx.fillRect(x - 9, y - 4, 18, 4);
        ctx.fillRect(x - 3, y - 18, 6, 14);
        ctx.fillRect(x - 8, y - 28, 16, 10);
        glow(x, y - 23, 18, 'rgba(255, 200, 120, 0.5)');
        ctx.fillStyle = '#ffd58a'; ctx.fillRect(x - 4, y - 26, 8, 6);
        ctx.fillStyle = '#7d786f';
        ctx.beginPath(); ctx.moveTo(x - 13, y - 28); ctx.lineTo(x, y - 36); ctx.lineTo(x + 13, y - 28); ctx.closePath(); ctx.fill();
        break;
      case 'torii':
        ctx.fillStyle = '#d62828';
        ctx.fillRect(x - 15, y - 34, 4, 34);
        ctx.fillRect(x + 11, y - 34, 4, 34);
        ctx.fillRect(x - 17, y - 28, 34, 3);
        ctx.fillStyle = '#2b2d42';
        ctx.beginPath(); ctx.moveTo(x - 22, y - 37); ctx.quadraticCurveTo(x, y - 33, x + 22, y - 37); ctx.lineTo(x + 20, y - 33); ctx.lineTo(x - 20, y - 33); ctx.closePath(); ctx.fill();
        break;
      case 'bamboo':
        for (let i = -1; i <= 1; i++) {
          const bh = (34 + (i + 1) * 9) * s;
          ctx.fillStyle = '#6cbf4b';
          ctx.fillRect(x + i * 6 - 2, y - bh, 4, bh);
          ctx.fillStyle = '#4c9a34';
          for (let k = 8; k < bh; k += 10) ctx.fillRect(x + i * 6 - 2.5, y - k, 5, 1.5);
          ctx.fillStyle = '#7fd35a'; ellipse(x + i * 6 + 6, y - bh + 4, 6, 2, -0.5);
        }
        break;
      case 'barrel':
        ctx.fillStyle = '#4c9a4e'; ellipse(x, y - 9 * s, 9 * s, 10 * s);
        ctx.strokeStyle = '#2f6e36'; ctx.lineWidth = 1.5;
        for (const k of [-4, 0, 4]) { ctx.beginPath(); ctx.moveTo(x + k * s, y - 18 * s); ctx.lineTo(x + k * s, y); ctx.stroke(); }
        ctx.fillStyle = '#ff5d8f'; circle(x, y - 19 * s, 3 * s);
        break;
      case 'agave':
        ctx.fillStyle = '#6aa58a';
        for (let i = -3; i <= 3; i++) {
          ctx.save(); ctx.translate(x, y); ctx.rotate(i * 0.38);
          ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(0, -(20 - Math.abs(i) * 2) * s); ctx.lineTo(3, 0); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        break;
      case 'marigold':
        ctx.strokeStyle = '#3f9b2f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, y - 11); ctx.stroke();
        ctx.fillStyle = '#ff9f1c'; circle(x, y - 14, 5.5);
        ctx.fillStyle = '#ffbf47'; circle(x - 1, y - 15, 3.2);
        break;
      case 'sombrero':
        ctx.fillStyle = '#e9c46a'; ellipse(x, y - 3, 17, 4.5);
        ctx.fillStyle = '#d4a84f'; ctx.beginPath(); ctx.ellipse(x, y - 5, 7, 9, 0, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#e63946'; ctx.fillRect(x - 7, y - 7, 14, 2.5);
        break;
      case 'vent':
        ctx.fillStyle = '#2a1d1b'; ellipse(x, y - 2, 10, 4);
        for (let k = 0; k < 3; k++) {
          const ph = (time * 0.6 + k / 3 + d.x * 0.01) % 1;
          ctx.fillStyle = `rgba(90, 70, 70, ${0.4 * (1 - ph)})`;
          circle(x + Math.sin(ph * 6 + d.x) * 4, y - 6 - ph * 40, 5 + ph * 10);
        }
        break;
    }
  }
}

function drawSpikes(camX) {
  for (const s of level.spikes) {
    const x = s.x - camX;
    if (x < -60 || x > W + 60) continue;
    for (let i = 0; i < 3; i++) {
      const bx = x + i * (s.w / 3), bw = s.w / 3;
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, theme.spike[0]); g.addColorStop(1, theme.spike[1]);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(bx, s.y + s.h); ctx.lineTo(bx + bw / 2, s.y); ctx.lineTo(bx + bw, s.y + s.h); ctx.closePath(); ctx.fill();
    }
  }
}

function drawFruit(kind, x, y, s = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (kind === 'apple') {
    const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, 13);
    g.addColorStop(0, '#ff8a8a'); g.addColorStop(1, '#c1121f');
    ctx.fillStyle = g; circle(0, 1, 11);
    ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(1, -14); ctx.stroke();
    ctx.fillStyle = '#5cc93f'; ellipse(6, -12, 5, 2.5, -0.5);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ellipse(-4, -3, 3, 2, -0.6);
  } else if (kind === 'banana') {
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.arc(0, -10, 16, 0.2 * Math.PI, 0.85 * Math.PI);
    ctx.arc(0, -17, 15, 0.8 * Math.PI, 0.25 * Math.PI, true);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4226'; circle(-13, -2, 2); circle(13, -1, 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ellipse(-2, 3, 5, 1.5);
  } else if (kind === 'grapes') {
    for (const [gx, gy] of [[-6, -4], [0, -5], [6, -4], [-3, 2], [3, 2], [0, 8]]) {
      const g = ctx.createRadialGradient(gx - 1.5, gy - 1.5, 0.5, gx, gy, 6);
      g.addColorStop(0, '#d9a7ff'); g.addColorStop(1, '#6a2c91');
      ctx.fillStyle = g; circle(gx, gy, 5);
    }
    ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(2, -14); ctx.stroke();
    ctx.fillStyle = '#5cc93f'; ellipse(-5, -11, 5, 2.5, 0.4);
  } else {
    ctx.fillStyle = '#2d8f4e';
    ctx.beginPath(); ctx.arc(0, -2, 14, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d8f3b6';
    ctx.beginPath(); ctx.arc(0, -2, 11.5, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath(); ctx.arc(0, -2, 10, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2b2d42';
    for (const [sx, sy] of [[-5, 1], [0, 4], [5, 1], [-2, 6], [3, 6]]) ellipse(sx, sy, 1, 1.6);
  }
  ctx.restore();
}

function drawFruits(camX) {
  for (const f of level.fruits) {
    if (f.taken) continue;
    const x = f.x - camX;
    if (x < -30 || x > W + 30) continue;
    const y = f.y + Math.sin(time * 3 + f.ph) * 3;
    glow(x, y, 22, 'rgba(255, 250, 200, 0.45)');
    drawFruit(f.kind, x, y);
  }
}

function drawCrates(camX) {
  for (const c of level.crates) {
    if (c.open) continue;
    const x = c.x - camX, y = c.y;
    if (x < -50 || x > W + 50) continue;
    const pulse = 0.5 + 0.5 * Math.sin(time * 4 + c.x);
    glow(x + 19, y + 19, 42, `rgba(255, 230, 140, ${0.25 + pulse * 0.25})`);
    const g = ctx.createLinearGradient(0, y, 0, y + c.h);
    g.addColorStop(0, '#d39251'); g.addColorStop(1, '#8d5524');
    ctx.fillStyle = g;
    rr(x, y, c.w, c.h, 4); ctx.fill();
    ctx.strokeStyle = '#5e3818'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = 'rgba(94, 56, 24, 0.7)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 13); ctx.lineTo(x + c.w - 4, y + 13);
    ctx.moveTo(x + 4, y + 26); ctx.lineTo(x + c.w - 4, y + 26);
    ctx.stroke();
    text('?', x + c.w / 2, y + c.h / 2 + 1, 22, `rgb(255, ${Math.round(220 + pulse * 35)}, 120)`);
  }
}

function drawCheckpoints(camX) {
  for (const cp of level.checkpoints) {
    const x = cp.x - camX;
    if (x < -80 || x > W + 80) continue;
    ctx.fillStyle = '#8a8172';
    rr(x - 6, cp.y + cp.h - 14, cp.w + 12, 14, 4); ctx.fill();
    ctx.fillStyle = '#5c4a3a';
    ctx.fillRect(x + cp.w / 2 - 3, cp.y, 6, cp.h - 12);
    const wave = Math.sin(time * 5) * 4;
    ctx.fillStyle = cp.active ? '#7ed957' : '#b0b0b0';
    ctx.beginPath();
    ctx.moveTo(x + cp.w / 2 + 3, cp.y + 4);
    ctx.quadraticCurveTo(x + cp.w / 2 + 20, cp.y + 8 + wave, x + cp.w / 2 + 38, cp.y + 14);
    ctx.quadraticCurveTo(x + cp.w / 2 + 20, cp.y + 22 - wave, x + cp.w / 2 + 3, cp.y + 30);
    ctx.closePath(); ctx.fill();
    if (cp.active) glow(x + cp.w / 2 + 18, cp.y + 16, 40, 'rgba(160, 255, 140, 0.4)');
  }
}

function drawStar(x, y, r1, r2, rot, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? r2 : r1, a = i * Math.PI / 5 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawGoal(camX) {
  if (!arena.done) return;
  // the Wonder Star drops in once the boss is beaten
  const drop = Math.pow(1 - arena.goalT, 3) * -300;
  const g0 = { ...level.goal, y: level.goal.y + drop }, x = g0.x - camX;
  if (x < -150 || x > W + 150) return;
  const cx = x + g0.w / 2;
  ctx.fillStyle = '#8a8172';
  rr(cx - 34, g0.y + g0.h - 20, 68, 20, 6); ctx.fill();
  const pole = ctx.createLinearGradient(cx - 6, 0, cx + 6, 0);
  pole.addColorStop(0, '#f2d27a'); pole.addColorStop(1, '#a8781c');
  ctx.fillStyle = pole;
  ctx.fillRect(cx - 5, g0.y + 30, 10, g0.h - 48);
  const wave = Math.sin(time * 4) * 6;
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(cx + 5, g0.y + 40);
  ctx.quadraticCurveTo(cx + 40, g0.y + 44 + wave, cx + 78, g0.y + 52);
  ctx.quadraticCurveTo(cx + 40, g0.y + 72 - wave, cx + 5, g0.y + 82);
  ctx.closePath(); ctx.fill();
  text('GOAL', cx + 38, g0.y + 61, 14, '#fff');
  const sy = g0.y + 18 + Math.sin(time * 2) * 4;
  glow(cx, sy, 70, 'rgba(255, 240, 150, 0.8)');
  drawStar(cx, sy, 20, 9, time * 1.5, '#ffd60a');
  drawStar(cx, sy, 9, 4, time * 1.5, '#fff6c2');
}

// Characters

function limb(x, y, ang, len, color, width, boot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
  if (boot) { ctx.fillStyle = boot; ellipse(2.5, len + 1, 5, 3.2); }
  ctx.restore();
}

// Hugo: black hair, blue t-shirt, red scarf
function drawHugo(p, x, y, s = 1) {
  ctx.save();
  ctx.translate(x, y);
  if (p.dying) { ctx.translate(0, -22); ctx.rotate(p.spin); ctx.translate(0, 22); }
  ctx.scale(s * p.facing * p.sx, s * p.sy);
  const moving = p.onGround && Math.abs(p.vx) > 30;
  const swing = moving ? Math.sin(p.runPhase) : 0;
  const bob = moving ? Math.abs(Math.cos(p.runPhase)) * 2.5 : 0;
  const air = !p.onGround;
  const legF = air ? -0.7 : swing * 0.8;
  const legB = air ? 0.5 : -swing * 0.8;
  const armF = p.throwT > 0 ? -2.5 : air ? -2.3 : -swing * 0.9;
  const armB = air ? 2.1 : swing * 0.9;

  // Scarf trailing behind
  ctx.strokeStyle = '#e63946';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-3, -31 - bob);
  for (let i = 1; i <= 4; i++) {
    const flow = moving || air ? 0.2 : 1;
    ctx.lineTo(-3 - i * 5, -31 - bob + Math.sin(time * 12 + i) * 2.2 + i * 1.8 * flow);
  }
  ctx.stroke();

  limb(-3, -28 - bob, armB, 12, '#d9a066', 4.5);
  limb(-3, -14, legB, 13, '#3b3f5c', 6, '#e9ecef');
  limb(3, -14, legF, 13, '#4a4e69', 6, '#ffffff');

  // T-shirt and shorts
  rr(-9, -33 - bob, 18, 17, 6);
  ctx.fillStyle = '#3a86ff'; ctx.fill();
  ctx.fillStyle = '#ffd166';
  drawStar(1, -26 - bob, 4, 1.8, 0, '#ffd166');
  ctx.fillStyle = '#2b2d42'; ctx.fillRect(-9, -18 - bob, 18, 6);

  // Head
  const hy = -43 - bob;
  ctx.fillStyle = '#f1c27d'; circle(1, hy, 11);
  ctx.fillStyle = '#e8b26e'; circle(-6, hy + 2, 3);
  ctx.fillStyle = '#fff'; ellipse(6, hy, 3.4, 4.2);
  ctx.fillStyle = '#3d2b1f'; circle(7, hy + 0.5, 2.1);
  ctx.fillStyle = '#fff'; circle(7.6, hy - 0.5, 0.7);
  ctx.fillStyle = 'rgba(230, 90, 90, 0.35)'; circle(5, hy + 6, 2.5);
  ctx.strokeStyle = '#8a4b2a'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(8, hy + 4.5, 2.5, 0.2, 1.4); ctx.stroke();

  // Black hair: rounded top, fringe and a cheeky tuft
  ctx.fillStyle = '#16161d';
  ctx.beginPath();
  ctx.arc(0, hy - 1, 12, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(12, hy - 2);
  ctx.lineTo(9, hy - 5);
  ctx.lineTo(6, hy - 2);
  ctx.lineTo(3, hy - 6);
  ctx.lineTo(0, hy - 3);
  ctx.lineTo(-6, hy - 4);
  ctx.lineTo(-8, hy + 4);
  ctx.lineTo(-12, hy + 2);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-3, hy - 11); ctx.quadraticCurveTo(-2, hy - 19, 4, hy - 17); ctx.quadraticCurveTo(0, hy - 15, 2, hy - 11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(120, 140, 200, 0.45)';
  ellipse(-2, hy - 8, 5, 1.6, -0.3);

  limb(3, -28 - bob, armF, 12, '#f1c27d', 4.5);
  ctx.restore();
}

function drawPlayer(camX) {
  const p = player;
  const x = p.x + p.w / 2 - camX, y = p.y + p.h;
  if (p.onGround && !p.dying) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ellipse(x, y, 15, 4);
  }
  if (p.firefly > 0) {
    glow(x, y - 24, 55, 'rgba(255, 250, 170, 0.55)');
    for (let i = 0; i < 3; i++) {
      const a = time * 5 + i * 2.1;
      ctx.fillStyle = '#fffbd0';
      circle(x + Math.cos(a) * 26, y - 24 + Math.sin(a) * 18, 3);
    }
  }
  ctx.save();
  if (p.invuln > 0 && Math.floor(time * 18) % 2) ctx.globalAlpha = 0.35;
  if (p.firefly > 0 && p.firefly < 2 && Math.floor(time * 10) % 2) ctx.globalAlpha = 0.7;
  drawHugo(p, x, y);
  ctx.restore();
}

function drawCrawler(e, x, by) {
  const [light, dark, body] = theme.crawler;
  ctx.save();
  ctx.translate(x, by);
  ctx.scale(e.dir < 0 ? 1 : -1, 1);
  const st = Math.sin(e.t * 6) * 1.5;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ellipse(0, 0, 20, 3);
  ctx.fillStyle = body; rr(-21 - st, -10, 40 + st, 10, 5); ctx.fill();
  ctx.strokeStyle = body; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-21 - st, -21); ctx.moveTo(-12, -8); ctx.lineTo(-13 - st, -22); ctx.stroke();
  ctx.fillStyle = '#fff'; circle(-21 - st, -22, 3.5); circle(-13 - st, -23, 3.5);
  ctx.fillStyle = '#222'; circle(-22 - st, -22, 1.6); circle(-14 - st, -23, 1.6);
  const g = ctx.createRadialGradient(1, -20, 2, 4, -16, 15);
  g.addColorStop(0, light); g.addColorStop(1, dark);
  ctx.fillStyle = g; circle(4, -16, 14);
  ctx.strokeStyle = def.theme === 'volcano' ? 'rgba(255, 160, 60, 0.9)' : 'rgba(0, 0, 0, 0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let a = 0; a < 11; a += 0.25) ctx.lineTo(4 + Math.cos(a) * (1 + a * 1.1), -16 + Math.sin(a) * (1 + a * 1.1));
  ctx.stroke();
  ctx.restore();
}

function drawHopper(e, x, by) {
  const [light, dark, belly] = theme.hopperC;
  ctx.save();
  ctx.translate(x, by);
  ctx.scale(e.dir < 0 ? 1 : -1, 1);
  const air = !e.onGround;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ellipse(0, 0, 17, 3);
  if (theme.hopper === 'slime') {
    const squash = air ? -3 : Math.sin(e.t * 5) * 2;
    if (def.theme === 'volcano') glow(0, -12, 30, 'rgba(255, 120, 40, 0.35)');
    const g = ctx.createRadialGradient(-5, -16, 2, 0, -10, 20);
    g.addColorStop(0, belly); g.addColorStop(0.3, light); g.addColorStop(1, dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-18 - squash, 0);
    ctx.quadraticCurveTo(-18, -26 - squash, 0, -27 - squash);
    ctx.quadraticCurveTo(18, -26 - squash, 18 + squash, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ellipse(-7, -15 - squash, 4, 5); ellipse(4, -15 - squash, 4, 5);
    ctx.fillStyle = '#222'; circle(-8, -14 - squash, 2); circle(3, -14 - squash, 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ellipse(-9, -22 - squash, 4, 2, -0.4);
  } else {
    const breathe = air ? 0 : Math.sin(e.t * 4);
    ctx.fillStyle = dark;
    if (air) ellipse(14, -4, 11, 4, 0.5); else ellipse(11, -5, 8, 5);
    const g = ctx.createRadialGradient(-4, -16, 2, 0, -12, 18);
    g.addColorStop(0, light); g.addColorStop(1, dark);
    ctx.fillStyle = g; ellipse(0, -12 - breathe, 17, 12 + breathe);
    ctx.fillStyle = belly; ellipse(-5, -7, 10, 5);
    for (const ex of [-9, 3]) {
      ctx.fillStyle = light; circle(ex, -23 - breathe, 6);
      ctx.fillStyle = '#fff'; circle(ex, -24 - breathe, 4);
      ctx.fillStyle = '#222'; circle(ex - 1, -24 - breathe, 2);
    }
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-6, -13, 7, 0.3, 1.6); ctx.stroke();
  }
  ctx.restore();
}

function drawFlyer(e, x, cy) {
  const [light, dark, wing] = theme.flyerC;
  ctx.save();
  ctx.translate(x, cy);
  const flap = Math.sin(e.t * 16);
  if (theme.flyer === 'bat') {
    if (def.theme === 'volcano') glow(0, 0, 30, 'rgba(255, 90, 54, 0.35)');
    ctx.fillStyle = dark;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.scale(side, 1);
      ctx.rotate(flap * 0.5);
      ctx.beginPath();
      ctx.moveTo(4, -2);
      ctx.quadraticCurveTo(16, -18, 30, -8);
      ctx.quadraticCurveTo(24, -4, 26, 2);
      ctx.quadraticCurveTo(18, -2, 16, 4);
      ctx.quadraticCurveTo(10, 0, 4, 4);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, 12);
    g.addColorStop(0, wing); g.addColorStop(1, light);
    ctx.fillStyle = g; circle(0, 0, 10);
    ctx.fillStyle = light;
    ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-6, -15); ctx.lineTo(-2, -8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -6); ctx.lineTo(6, -15); ctx.lineTo(2, -8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff6a5'; circle(-4, -2, 2.4); circle(4, -2, 2.4);
    ctx.fillStyle = '#222'; circle(-4, -2, 1); circle(4, -2, 1);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-3, 4); ctx.lineTo(-1.5, 7); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(14, -2); ctx.lineTo(26, -9); ctx.lineTo(24, 4); ctx.closePath(); ctx.fill();
    const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, 18);
    g.addColorStop(0, light); g.addColorStop(1, dark);
    ctx.fillStyle = g; ellipse(0, 0, 18, 11);
    ctx.fillStyle = '#fff4e6'; ellipse(-4, 4, 9, 5);
    ctx.fillStyle = '#ff8c42';
    ctx.beginPath(); ctx.moveTo(-20, -5); ctx.lineTo(-30, -2); ctx.lineTo(-20, 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; circle(-12, -5, 4);
    ctx.fillStyle = '#222'; circle(-13, -5, 2);
    ctx.save();
    ctx.translate(4, -6);
    ctx.rotate(-0.3 + flap * 0.8);
    ctx.fillStyle = wing; ellipse(6, -8, 13, 6, -0.3);
    ctx.restore();
  }
  ctx.restore();
}

function drawEnemies(camX) {
  for (const e of level.enemies) {
    if (!e.alive) continue;
    const x = e.x + e.w / 2 - camX;
    if (x < -60 || x > W + 60) continue;
    if (e.type === 'crawler') drawCrawler(e, x, e.y + e.h);
    else if (e.type === 'hopper') drawHopper(e, x, e.y + e.h);
    else drawFlyer(e, x, e.y + e.h / 2);
  }
}

const LOOKS = {
  hailey: { skin: '#f6d0a8', hair: '#f4d35e', style: 'ponytail', bow: '#ff4f9a', top: '#ff6fa8', sleeve: '#f6d0a8',
            bottom: '#8e5cd9', legs: '#8e5cd9', shoes: '#ffffff', lashes: true },
  rian:   { skin: '#f6d0a8', hair: '#ead18c', style: 'short', top: '#2a9d8f', sleeve: '#2a9d8f', hood: '#21867a',
            bottom: '#3d5a80', legs: '#3d5a80', shoes: '#ffffff' },

            skirt: '#2b3a67', legs: '#e8c4a0', shoes: '#3d2b1f', glasses: true, lashes: true }
};
const PERSON_SCALE = { hailey: 1.15, rian: 1.0, teacher: 1.55 };

function drawPerson(x, y, s, facing, look, a) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * facing, s);
  const swing = a.moving ? Math.sin(a.phase) : 0;
  const bob = a.moving ? Math.abs(Math.cos(a.phase)) * 2.5 : 0;
  const legF = a.air ? -0.7 : swing * 0.8, legB = a.air ? 0.5 : -swing * 0.8;
  const wave = Math.sin(time * 10) * 0.35;
  const armF = a.armsUp ? -2.7 + wave : a.throwT > 0 ? -2.5 : a.air ? -2.3 : -swing * 0.9;
  const armB = a.armsUp ? 2.7 - wave : a.air ? 2.1 : swing * 0.9;
  const hy = -43 - bob;

  // Hair that sits behind the head
  ctx.fillStyle = look.hair;
  if (look.style === 'ponytail') ellipse(-13, hy + 3 + Math.sin(time * 7) * 1.5, 5.5, 11, 0.55 + Math.sin(time * 5) * 0.15);
  if (look.style === 'long') { rr(-12, hy - 4, 22, 25, 7); ctx.fill(); }

  limb(-3, -28 - bob, armB, 12, look.sleeve, 4.5);
  limb(-3, -14, legB, 13, look.legs, 5.5, look.shoes);
  limb(3, -14, legF, 13, look.legs, 5.5, look.shoes);

  // Body
  if (look.skirt) {
    ctx.fillStyle = look.skirt;
    ctx.beginPath();
    ctx.moveTo(-9, -21 - bob); ctx.lineTo(9, -21 - bob); ctx.lineTo(12, -10); ctx.lineTo(-12, -10);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = look.bottom;
    ctx.fillRect(-9, -18 - bob, 18, 6);
  }
  if (look.hood) { ctx.fillStyle = look.hood; rr(-12, -36 - bob, 11, 9, 4); ctx.fill(); }
  rr(-9, -33 - bob, 18, look.skirt ? 13 : 16, 6);
  ctx.fillStyle = look.top; ctx.fill();
  if (look.cardigan) {
    ctx.fillStyle = look.cardigan;
    ctx.fillRect(-9, -33 - bob, 6, 13);
    ctx.fillRect(4, -33 - bob, 5, 13);
    ctx.fillStyle = '#ffd166'; circle(5.5, -29 - bob, 1); circle(5.5, -24 - bob, 1);
  }
  if (look.hood) { ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; circle(1, -26 - bob, 3); }

  // Head and face
  ctx.fillStyle = look.skin; circle(1, hy, 11);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; circle(-6, hy + 2, 3);
  ctx.fillStyle = '#fff'; ellipse(6, hy, 3.4, 4.2);
  ctx.fillStyle = look.style === 'short' ? '#3d2b1f' : '#2f6fb3'; circle(7, hy + 0.5, 2.1);
  ctx.fillStyle = '#fff'; circle(7.6, hy - 0.5, 0.7);
  if (look.lashes) {
    ctx.strokeStyle = '#3d2b1f'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(4, hy - 4); ctx.lineTo(9.5, hy - 4.5); ctx.lineTo(10.5, hy - 6); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(230, 90, 90, 0.35)'; circle(5, hy + 6, 2.5);
  ctx.strokeStyle = '#8a4b2a'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(8, hy + 4.5, 2.5, 0.2, 1.4); ctx.stroke();

  // Hair in front
  ctx.fillStyle = look.hair;
  if (look.style === 'short') {
    ctx.beginPath();
    ctx.arc(0, hy - 1, 12, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(12, hy - 2); ctx.lineTo(9, hy - 5); ctx.lineTo(6, hy - 2); ctx.lineTo(3, hy - 6);
    ctx.lineTo(0, hy - 3); ctx.lineTo(-6, hy - 4); ctx.lineTo(-8, hy + 4); ctx.lineTo(-12, hy + 2);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, hy - 11); ctx.lineTo(-9, hy - 17); ctx.lineTo(-1, hy - 12); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(0, hy - 1, 12.5, Math.PI * 0.9, Math.PI * 2.08);
    ctx.quadraticCurveTo(7, hy - 6, -1, hy - 5);
    ctx.quadraticCurveTo(-8, hy - 2, -10, hy + 6);
    ctx.lineTo(-12.5, hy + 2);
    ctx.closePath(); ctx.fill();
    if (look.style === 'long') { rr(-13, hy - 3, 7, 22, 3); ctx.fill(); }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ellipse(-1, hy - 9, 6, 1.8, -0.2);
  }
  if (look.bow) {
    ctx.fillStyle = look.bow;
    ctx.beginPath(); ctx.moveTo(-9, hy - 10); ctx.lineTo(-15, hy - 15); ctx.lineTo(-15, hy - 5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9, hy - 10); ctx.lineTo(-3, hy - 15); ctx.lineTo(-3, hy - 5); ctx.closePath(); ctx.fill();
    circle(-9, hy - 10, 2.2);
  }
  if (look.glasses) {
    ctx.strokeStyle = '#5a3d2b'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(6.5, hy, 4.4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, hy - 1); ctx.lineTo(-5, hy - 2); ctx.stroke();
  }

  limb(3, -28 - bob, armF, 12, look.sleeve, 4.5);
  ctx.restore();
}

// Xiav the golden doodle: curly golden coat, floppy ears and a green collar
function drawXiav(b, x, by) {
  ctx.save();
  ctx.translate(x, by);
  ctx.scale(b.facing, 1);
  const moving = Math.abs(b.vx) > 20;
  const ph = b.phase * 18;
  const gold = '#e2b670', dark = '#c4914a', light = '#f3d59c';

  ctx.save();
  ctx.translate(-36, -36);
  ctx.rotate(-0.9 + Math.sin(time * (b.defeated ? 20 : 12)) * 0.45);
  ctx.fillStyle = gold;
  for (let i = 0; i < 5; i++) circle(-i * 4, -i * 5, 6.5 - i * 0.6);
  ctx.restore();

  for (const [lx, off] of [[-26, 0], [-14, Math.PI], [12, Math.PI * 0.5], [24, Math.PI * 1.5]]) {
    const sw = moving ? Math.sin(ph + off) * 0.55 : 0;
    ctx.save();
    ctx.translate(lx, -20);
    ctx.rotate(sw);
    ctx.fillStyle = dark; rr(-4.5, 0, 9, 19, 4); ctx.fill();
    ctx.fillStyle = light; ellipse(1, 19, 6, 3);
    ctx.restore();
  }

  ctx.fillStyle = dark; ellipse(-4, -31, 35, 16);
  ctx.fillStyle = gold;
  for (let i = 0; i < 14; i++) circle(-34 + (i % 7) * 10 + (i % 2) * 3, -40 + Math.floor(i / 7) * 12, 8);
  ctx.fillStyle = light;
  for (let i = 0; i < 5; i++) circle(-28 + i * 12, -45, 3);

  ctx.fillStyle = '#2a9d5c'; rr(18, -44, 7, 18, 3); ctx.fill();
  ctx.fillStyle = '#ffd166'; circle(23, -25, 3);

  ctx.fillStyle = gold; circle(33, -48, 15);
  for (let i = 0; i < 6; i++) circle(30 + Math.cos(i * 1.1) * 11, -58 + Math.sin(i * 1.7) * 4, 6);
  ctx.fillStyle = dark; ellipse(21, -42, 6.5, 14, 0.25 + Math.sin(time * 6) * 0.12);
  ctx.fillStyle = light; ellipse(45, -42, 11, 8.5);
  ctx.fillStyle = '#2b1b12'; ellipse(54, -45, 4.2, 3.2);
  ctx.fillStyle = '#2b1b12'; circle(37, -52, 2.8);
  ctx.fillStyle = '#fff'; circle(38, -53, 0.9);
  if (moving || b.defeated || b.mode === 'wag') {
    ctx.fillStyle = '#ff7b9c'; ellipse(47, -33, 3.6, 5 + Math.sin(time * 12));
  }
  ctx.restore();
}

// The Ramen Monster: a big bowl with a face, noodles, toppings, chopsticks and steam
function drawRamen(b, x, by) {
  ctx.save();
  ctx.translate(x, by);
  const sq = b.onGround ? 1 + Math.sin(b.phase * 6) * 0.03 : 0.94;
  ctx.scale(1, sq);
  const look = clamp((player.x + player.w / 2 - (b.x + b.w / 2)) / 200, -1, 1) * 3;
  const happy = b.defeated;

  // Steam
  for (let k = 0; k < 4; k++) {
    const ph = (time * 0.6 + k / 4) % 1;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.45 * (1 - ph)})`;
    circle(-30 + k * 20 + Math.sin(ph * 6 + k) * 6, -96 - ph * 60, 8 + ph * 10);
  }
  // Chopsticks
  ctx.strokeStyle = '#c68642'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(18, -78); ctx.lineTo(48, -130); ctx.moveTo(30, -78); ctx.lineTo(66, -122); ctx.stroke();
  // Broth and toppings
  ctx.fillStyle = '#e9a23b'; ellipse(0, -80, 58, 14);
  ctx.fillStyle = '#f2b95a'; ellipse(-6, -82, 40, 8);
  ctx.strokeStyle = '#f9dc6b'; ctx.lineWidth = 3;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 12 - 6, -84);
    ctx.quadraticCurveTo(i * 12, -94 - Math.abs(i) * 2 + Math.sin(time * 4 + i) * 2, i * 12 + 6, -84);
    ctx.stroke();
  }
  ctx.fillStyle = '#1f3a2e';
  ctx.save(); ctx.translate(-40, -92); ctx.rotate(-0.25); ctx.fillRect(-7, -16, 14, 26); ctx.restore();
  ctx.fillStyle = '#ffffff'; circle(-18, -86, 9);
  ctx.strokeStyle = '#ff6fa8'; ctx.lineWidth = 2;
  ctx.beginPath(); for (let a = 0; a < 9; a += 0.3) ctx.lineTo(-18 + Math.cos(a) * a * 0.75, -86 + Math.sin(a) * a * 0.75); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ellipse(14, -88, 11, 8);
  ctx.fillStyle = '#ffb703'; circle(14, -88, 5);

  // Bowl
  const g = ctx.createLinearGradient(0, -80, 0, 0);
  g.addColorStop(0, '#e63946'); g.addColorStop(1, '#8d1b25');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-60, -80);
  ctx.quadraticCurveTo(-58, -6, -26, -4);
  ctx.lineTo(26, -4);
  ctx.quadraticCurveTo(58, -6, 60, -80);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = -52; i <= 52; i += 4) ctx.lineTo(i, -70 + Math.sin(i * 0.25) * 3);
  ctx.stroke();
  ctx.fillStyle = '#5c1018'; rr(-26, -6, 52, 8, 3); ctx.fill();
  // Noodles hanging over the rim
  ctx.strokeStyle = '#f9dc6b'; ctx.lineWidth = 3;
  for (const nx of [-44, -30, 36, 48]) {
    ctx.beginPath(); ctx.moveTo(nx, -80); ctx.quadraticCurveTo(nx + 4, -70, nx - 2 + Math.sin(time * 5 + nx) * 3, -60); ctx.stroke();
  }
  // Face
  if (happy) {
    ctx.strokeStyle = '#2b1b12'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-20, -46, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(20, -46, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.fillStyle = '#5c1018';
    ctx.beginPath(); ctx.arc(0, -30, 14, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255, 150, 160, 0.6)'; circle(-36, -36, 6); circle(36, -36, 6);
  } else {
    for (const ex of [-20, 20]) {
      ctx.fillStyle = '#ffffff'; ellipse(ex, -46, 10, 12);
      ctx.fillStyle = '#2b1b12'; circle(ex + look, -44, 5);
      ctx.fillStyle = '#ffffff'; circle(ex + look + 1.5, -46, 1.5);
    }
    ctx.strokeStyle = '#2b1b12'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-31, -62); ctx.lineTo(-11, -56); ctx.moveTo(31, -62); ctx.lineTo(11, -56); ctx.stroke();
    ctx.fillStyle = '#5c1018';
    ctx.beginPath(); ctx.moveTo(-18, -30); ctx.quadraticCurveTo(0, b.throwT > 0 ? -10 : -20, 18, -30); ctx.quadraticCurveTo(0, -22, -18, -30); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-10, -29, 6, 4); ctx.fillRect(4, -29, 6, 4);
  }
  ctx.restore();
}

// El Taco Grande: a giant crunchy taco with little legs, a face and a sombrero
function drawTaco(b, x, by) {
  ctx.save();
  ctx.translate(x, by);
  ctx.scale(b.facing, 1);
  const crouch = b.mode === 'crouch' ? 0.88 : 1;
  ctx.scale(1, b.onGround ? crouch + Math.sin(b.phase * 8) * 0.025 : 1.05);
  const moving = b.onGround && Math.abs(b.vx) > 20;
  const happy = b.defeated;

  // Legs and boots
  for (const [lx, off] of [[-24, 0], [22, Math.PI]]) {
    const sw = moving ? Math.sin(b.phase * 14 + off) * 6 : 0;
    ctx.strokeStyle = '#c98a3a'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lx, -16); ctx.lineTo(lx + sw, -4); ctx.stroke();
    ctx.fillStyle = '#5a3a1e'; ellipse(lx + sw + 4, -2, 9, 4.5);
  }
  // Filling peeking over the top of the shell
  ctx.fillStyle = '#7a4a2a'; ellipse(0, -68, 52, 10);
  ctx.fillStyle = '#6fcf4f';
  ctx.beginPath();
  ctx.moveTo(-56, -66);
  for (let i = -56; i <= 56; i += 8) ctx.lineTo(i + 4, -78 - ((i / 8) % 2 ? 6 : 0) + Math.sin(time * 5 + i) * 1.5);
  ctx.lineTo(56, -66); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e63946';
  for (const tx of [-34, -8, 20, 42]) circle(tx, -76, 6);
  ctx.fillStyle = '#ffd166';
  for (const cx of [-44, -20, 6, 30]) ctx.fillRect(cx, -84, 5, 12);
  // Shell
  const g = ctx.createLinearGradient(0, -70, 0, -14);
  g.addColorStop(0, '#ffd27a'); g.addColorStop(1, '#e0a040');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-60, -68);
  ctx.quadraticCurveTo(-58, -12, 0, -12);
  ctx.quadraticCurveTo(58, -12, 60, -68);
  ctx.quadraticCurveTo(0, -60, -60, -68);
  ctx.fill();
  ctx.fillStyle = 'rgba(160, 100, 30, 0.35)';
  for (const [sx, sy] of [[-40, -50], [-30, -28], [34, -46], [42, -30], [-8, -22], [12, -56]]) circle(sx, sy, 3);
  // Face
  if (happy) {
    ctx.strokeStyle = '#3d2410'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-6, -44, 6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(22, -44, 6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.fillStyle = '#8a2a1e';
    ctx.beginPath(); ctx.arc(8, -30, 11, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255, 120, 120, 0.55)'; circle(-20, -34, 5); circle(36, -34, 5);
  } else {
    const look = clamp(Math.abs(player.x + player.w / 2 - (b.x + b.w / 2)) / 200, 0, 1) * 2.5;
    for (const ex of [-6, 22]) {
      ctx.fillStyle = '#ffffff'; ellipse(ex, -44, 8, 9);
      ctx.fillStyle = '#3d2410'; circle(ex + look, -43, 4);
      ctx.fillStyle = '#ffffff'; circle(ex + look + 1.2, -45, 1.2);
    }
    ctx.strokeStyle = '#3d2410'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-15, -57); ctx.lineTo(0, -53); ctx.moveTo(31, -57); ctx.lineTo(16, -53); ctx.stroke();
    // Big moustache
    ctx.fillStyle = '#3d2410';
    ctx.beginPath();
    ctx.moveTo(8, -34);
    ctx.quadraticCurveTo(-4, -40, -14, -30); ctx.quadraticCurveTo(-4, -32, 8, -30);
    ctx.quadraticCurveTo(20, -32, 30, -30); ctx.quadraticCurveTo(20, -40, 8, -34);
    ctx.fill();
    ctx.fillStyle = '#8a2a1e';
    ctx.beginPath(); ctx.ellipse(8, -24, 8, b.throwT > 0 ? 6 : 3, 0, 0, Math.PI * 2); ctx.fill();
  }
  // Sombrero
  ctx.save();
  ctx.translate(0, -84);
  ctx.rotate(-0.12 + (b.mode === 'leap' ? -0.15 : 0));
  ctx.fillStyle = '#e9c46a'; ellipse(0, 0, 50, 9);
  ctx.fillStyle = '#d4a84f'; ctx.beginPath(); ctx.ellipse(0, -2, 20, 26, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#e63946'; ctx.fillRect(-20, -8, 40, 5);
  ctx.fillStyle = '#2ec4b6'; for (let i = -16; i <= 16; i += 8) circle(i, -5.5, 1.6);
  ctx.strokeStyle = '#c1553d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 46, 7, 0, 0, Math.PI); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawBubble(x, y, str) {
  ctx.font = `bold 15px ${FONT}`;
  const w = ctx.measureText(str).width + 22, h = 30;
  const bx = clamp(x - w / 2, 8, W - w - 8), by = Math.max(8, y - h - 12);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  rr(bx, by, w, h, 10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 7, by + h); ctx.lineTo(x + 2, by + h + 10); ctx.lineTo(x + 7, by + h); ctx.closePath(); ctx.fill();
  text(str, bx + w / 2, by + h / 2 + 1, 15, '#1d3557', 'center', 'bold', false);
}

function drawBoss(camX) {
  if (!boss) return;
  const b = boss, x = b.x + b.w / 2 - camX, y = b.y + b.h;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ellipse(x, surfaceY(clamp(Math.floor((b.x + b.w / 2) / T), 0, COLS - 1)), b.w * 0.6, 5);
  ctx.save();
  if (b.hurtT > 0 && Math.floor(time * 20) % 2) ctx.globalAlpha = 0.4;
  if (b.kind === 'xiav') drawXiav(b, x, y);
  else if (b.kind === 'ramen') drawRamen(b, x, y);
  else if (b.kind === 'taco') drawTaco(b, x, y);
  else {
    drawPerson(x, y, PERSON_SCALE[b.kind], b.facing, LOOKS[b.kind], {
      moving: b.onGround && Math.abs(b.vx) > 20, air: !b.onGround, phase: b.phase * 11,
      throwT: b.throwT, armsUp: b.defeated && b.dizzyT <= 0
    });
  }
  ctx.restore();
  if (b.defeated && b.dizzyT > 0) {
    for (let i = 0; i < 3; i++) {
      const a = time * 6 + i * 2.1;
      drawStar(x + Math.cos(a) * 20, b.y - 6 + Math.sin(a) * 6, 6, 2.5, a, '#ffd60a');
    }
  }
  if (b.defeated && b.kind === 'xiav' && b.dizzyT <= 0) {
    for (let i = 0; i < 3; i++) heart(x - 20 + i * 20, b.y - 20 - ((time * 30 + i * 15) % 40), 12, '#ff4d6d');
  }
  if (b.sayT > 0 && vsT < 0.2) drawBubble(x, b.y - (b.kind === 'ramen' ? 40 : b.kind === 'taco' ? 46 : 10), b.say);
}

function drawVersus() {
  if (vsT <= 0 || !boss) return;
  const shown = 2.4 - vsT;
  const slide = Math.min(1, shown * 3);
  ctx.globalAlpha = Math.min(1, vsT * 3, shown * 6);
  ctx.fillStyle = 'rgba(10, 10, 30, 0.8)';
  ctx.fillRect(0, H / 2 - 75, W, 150);
  ctx.fillStyle = '#ffd166';
  ctx.fillRect(0, H / 2 - 75, W, 4);
  ctx.fillRect(0, H / 2 + 71, W, 4);
  const lx = -200 + (W / 2 - 230 + 200) * slide, rx = W + 200 - (W + 200 - (W / 2 + 230)) * slide;
  text('HUGO', lx, H / 2, 56, '#4cc9f0');
  const flash = Math.floor(time * 8) % 2;
  text('VS', W / 2, H / 2, flash ? 78 : 70, flash ? '#ffd166' : '#ff4d6d');
  text(boss.name, rx, H / 2, boss.name.length > 8 ? 36 : 56, '#ff4d6d');
  ctx.globalAlpha = 1;
}

function drawShots(camX) {
  for (const s of bossShots) {
    if (s.delay > 0) continue;
    const x = s.x - camX;
    if (s.kind === 'nigiri') {
      ctx.save();
      ctx.translate(x, s.y);
      ctx.rotate(s.spin * 0.6);
      ctx.fillStyle = '#ffffff'; rr(-14, -4, 28, 12, 6); ctx.fill();
      ctx.fillStyle = '#ff8c5a'; rr(-15, -10, 30, 9, 5); ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      for (let i = -9; i <= 9; i += 6) ctx.fillRect(i, -9, 2, 7);
      ctx.fillStyle = '#1f3a2e'; ctx.fillRect(-3, -10, 6, 18);
      ctx.restore();
    } else if (s.kind === 'chip') {
      ctx.save();
      ctx.translate(x, s.y);
      ctx.rotate(s.spin);
      ctx.fillStyle = '#f2c14e';
      ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(12, 9); ctx.lineTo(-12, 9); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(180, 110, 30, 0.5)'; circle(-3, 2, 1.6); circle(4, 4, 1.6); circle(0, -4, 1.4);
      ctx.restore();
    } else if (s.kind === 'pepper') {
      ctx.save();
      ctx.translate(x, s.y);
      ctx.rotate(s.spin * 0.7);
      ctx.fillStyle = '#2f9e44'; ellipse(0, 0, 14, 7);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)'; ellipse(-2, -3, 8, 2);
      ctx.strokeStyle = '#5c7a2e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(13, 0); ctx.quadraticCurveTo(18, -2, 19, -8); ctx.stroke();
      ctx.restore();
      glow(x, s.y, 16, 'rgba(255, 120, 40, 0.3)');
    } else if (s.kind === 'salsa') {
      glow(x, s.y, 22, 'rgba(255, 80, 40, 0.35)');
      ctx.fillStyle = '#d62828';
      ctx.beginPath(); ctx.ellipse(x, s.y + 4, 16, 9, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#e63946';
      for (let i = -1; i <= 1; i++) circle(x + i * 7, s.y - 2 + Math.sin(time * 18 + i) * 3, 5);
      ctx.fillStyle = '#7ccf6a'; circle(x - 4, s.y - 5, 1.8); circle(x + 5, s.y - 1, 1.6);
    } else if (s.kind === 'maki') {
      ctx.save();
      ctx.translate(x, s.y);
      ctx.rotate(s.spin);
      ctx.fillStyle = '#1f3a2e'; circle(0, 0, s.r);
      ctx.fillStyle = '#ffffff'; circle(0, 0, s.r - 3);
      ctx.fillStyle = '#ff8c5a'; circle(0, 0, 4.5);
      ctx.fillStyle = '#7ccf6a'; circle(3, 3, 2);
      ctx.restore();
    } else if (s.kind === 'balloon') {
      ctx.fillStyle = s.color; ellipse(x, s.y, s.r, s.r * 1.15);
      ctx.beginPath(); ctx.moveTo(x - 3, s.y + s.r * 1.15 + 3); ctx.lineTo(x + 3, s.y + s.r * 1.15 + 3); ctx.lineTo(x, s.y + s.r * 1.1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ellipse(x - 4, s.y - 4, 3, 4.5, -0.5);
    } else if (s.kind === 'ball') {
      ctx.save();
      ctx.translate(x, s.y);
      ctx.rotate(s.spin);
      ctx.fillStyle = '#ffffff'; circle(0, 0, s.r);
      ctx.fillStyle = '#1b1b1b';
      ctx.beginPath();
      for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * 4.5, Math.sin(a) * 4.5); }
      ctx.closePath(); ctx.fill();
      for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5 + Math.PI / 2; circle(Math.cos(a) * 10, Math.sin(a) * 10, 2.6); }
      ctx.restore();
    } else if (s.kind === 'plane') {
      ctx.save();
      ctx.translate(x, s.y);
      ctx.scale(Math.sign(s.vx) || 1, 1);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-12, -9); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d6e4f2';
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-12, 7); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#7f9bb8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-6, 0); ctx.stroke();
      ctx.restore();
    } else if (s.kind === 'book') {
      if (s.warn > 0) {
        const gy = surfaceY(clamp(Math.floor(s.x / T), 0, COLS - 1));
        ctx.fillStyle = `rgba(0, 0, 0, ${0.25 + 0.2 * Math.sin(time * 20)})`;
        ellipse(x, gy, 18, 5);
        text('!', x, 30, 22, '#ff4d4d');
      } else {
        ctx.save();
        ctx.translate(x, s.y);
        ctx.rotate(Math.sin(time * 8 + s.x) * 0.3);
        ctx.fillStyle = s.color; rr(-13, -10, 26, 20, 3); ctx.fill();
        ctx.fillStyle = '#fffaf0'; ctx.fillRect(-11, 6, 22, 3);
        ctx.restore();
      }
    }
  }
}

function drawArenaGate(camX) {
  if (!arena.active || arena.done) return;
  const x = arena.left - camX - 8, gy = surfaceY(Math.floor(arena.left / T));
  ctx.fillStyle = '#6b5f52';
  rr(x - 6, gy - 200, 20, 200, 4); ctx.fill();
  ctx.fillStyle = '#4a4038';
  for (let i = 0; i < 6; i++) ctx.fillRect(x - 6, gy - 190 + i * 32, 20, 3);
  glow(x + 4, gy - 100, 60, 'rgba(255, 210, 120, 0.2)');
}

function drawBoomerangShape(x, y, ang, s = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(s, s);
  ctx.fillStyle = '#d4a373';
  ctx.strokeStyle = '#7f5539';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, -10);
  ctx.quadraticCurveTo(0, -2, 14, -10);
  ctx.lineTo(10, -2);
  ctx.quadraticCurveTo(0, 6, -10, -2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawParticles(camX) {
  for (const pt of particles) {
    const a = clamp(pt.life / pt.max, 0, 1);
    const x = pt.x - camX;
    if (pt.kind === 'spark') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      circle(x, pt.y, pt.size * (0.5 + a));
      ctx.restore();
    } else if (pt.kind === 'chip' || pt.kind === 'confetti') {
      ctx.save();
      ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.translate(x, pt.y);
      ctx.rotate(pt.rot);
      ctx.fillStyle = pt.color;
      ctx.fillRect(-pt.size / 2, -pt.size / 4, pt.size, pt.size / 2);
      ctx.restore();
    } else {
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = pt.color;
      circle(x, pt.y, pt.size * (1.4 - a * 0.4));
      ctx.globalAlpha = 1;
    }
  }
  for (const pp of popups) {
    ctx.globalAlpha = clamp(pp.life * 1.5, 0, 1);
    text(pp.text, pp.x - camX, pp.y, 16, pp.color);
    ctx.globalAlpha = 1;
  }
}

function drawForeground(camX) {
  const f = 1.3, spacing = 420, off = camX * f;
  const i0 = Math.floor((off - 200) / spacing), i1 = Math.floor((off + W + 200) / spacing);
  ctx.fillStyle = theme.fg;
  for (let i = i0; i <= i1; i++) {
    const r = mulberry32(i * 331 + 5);
    const x = i * spacing - off + r() * 200;
    const h = 30 + r() * 25;
    for (let k = 0; k < 6; k++) {
      const a = (k - 2.5) * 0.35 + Math.sin(time * 1.5 + i + k) * 0.05;
      ctx.save();
      ctx.translate(x, H + 6);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(8, -h * 0.5, 0, -h);
      ctx.quadraticCurveTo(-8, -h * 0.5, 0, 0);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawAmbient() {
  for (const a of ambient) {
    if (a.kind === 'leaves' || a.kind === 'petals') {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = a.color;
      ellipse(0, 0, a.size, a.size * 0.45);
      ctx.restore();
    } else if (a.kind === 'fiesta') {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = a.color;
      ctx.fillRect(-a.size, -a.size * 0.6, a.size * 2, a.size * 1.2);
      ctx.restore();
    } else if (a.kind === 'snow') {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      circle(a.x, a.y, a.size);
    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(time * 3 + a.rot);
      ctx.fillStyle = a.color;
      circle(a.x, a.y, a.size);
      ctx.restore();
    }
  }
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.7);
  g.addColorStop(0, 'rgba(0, 0, 0, 0)');
  g.addColorStop(1, theme.vignette);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ===========================================================================
// HUD and screens
// ===========================================================================
function heart(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x, y, x - s * 0.55, y, x - s * 0.55, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 0.55, y + s * 0.65, x, y + s * 0.85, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.85, x + s * 0.55, y + s * 0.65, x + s * 0.55, y + s * 0.35);
  ctx.bezierCurveTo(x + s * 0.55, y, x, y, x, y + s * 0.35);
  ctx.fill();
}

function drawHud() {
  const p = player;
  ctx.fillStyle = 'rgba(10, 25, 40, 0.5)';
  rr(14, 12, 350, 64, 12); ctx.fill();
  heart(36, 21, 22, '#ff4d6d');
  text(`x ${lives}`, 52, 32, 17, '#fff', 'left');
  text('ENERGY', 136, 30, 13, '#fff', 'left');
  const bx = 136, by = 42, bw = 214, bh = 16;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; rr(bx, by, bw, bh, 6); ctx.fill();
  const low = p.energy < 25;
  if (!low || Math.floor(time * 6) % 2) {
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    if (low) { g.addColorStop(0, '#ff4d4d'); g.addColorStop(1, '#ff8c42'); }
    else { g.addColorStop(0, '#ffd166'); g.addColorStop(1, '#7ed957'); }
    ctx.fillStyle = g;
    rr(bx + 2, by + 2, Math.max(0, (bw - 4) * p.energy / 100), bh - 4, 4); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  for (let i = 1; i < 10; i++) ctx.fillRect(bx + i * bw / 10, by + 2, 1.5, bh - 4);
  if (p.weapon) drawBoomerangShape(40, 60, 0.3, 0.75);
  if (p.firefly > 0) text(`FIREFLY ${Math.ceil(p.firefly)}`, 64, 61, 12, '#fff6a5', 'left');

  ctx.fillStyle = 'rgba(10, 25, 40, 0.5)';
  rr(W - 224, 12, 210, 64, 12); ctx.fill();
  text(`SCORE ${String(score).padStart(6, '0')}`, W - 30, 31, 18, '#fff', 'right');
  drawFruit('apple', W - 200, 58, 0.75);
  text(`x ${levelFruit}`, W - 182, 58, 15, '#fff', 'left');
  const m = Math.floor(levelTime / 60), s = Math.floor(levelTime % 60);
  text(`${m}:${String(s).padStart(2, '0')}`, W - 30, 58, 15, '#cde', 'right');

  text(`WORLD ${levelIndex + 1}  ${def.name.toUpperCase()}`, W / 2, 24, 14, 'rgba(255, 255, 255, 0.85)');

  if (boss && arena.active && !boss.defeated) {
    const bw = 300, bx = W / 2 - bw / 2, by = 56;
    ctx.fillStyle = 'rgba(10, 25, 40, 0.6)';
    rr(bx - 10, 36, bw + 20, 44, 10); ctx.fill();
    text(`BOSS: ${boss.name}`, W / 2, 46, 13, '#ffd166');
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; rr(bx, by, bw, 14, 6); ctx.fill();
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#ff4d6d'); g.addColorStop(1, '#ff9f1c');
    ctx.fillStyle = g;
    rr(bx + 2, by + 2, (bw - 4) * boss.hp / boss.maxHp, 10, 4); ctx.fill();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    for (let i = 1; i < boss.maxHp; i++) ctx.fillRect(bx + i * bw / boss.maxHp, by + 2, 2, 10);
  }
  text(muted ? 'M: sound off' : 'M: mute', W - 18, H - 14, 11, 'rgba(255, 255, 255, 0.6)', 'right', 'normal', false);

  drawVersus();

  if (bannerT > 0) {
    const a = Math.min(1, bannerT, (3 - bannerT) * 3);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10, 20, 40, 0.55)';
    rr(W / 2 - 230, H / 2 - 80, 460, 110, 18); ctx.fill();
    text(`WORLD ${levelIndex + 1}`, W / 2, H / 2 - 50, 22, '#ffd166');
    text(def.name, W / 2, H / 2 - 12, 40, '#fff');
    ctx.globalAlpha = 1;
  }
}
