// ---------------------------------------------------------------------------
// Flights: short flying stages to Japan (after World 4) and Mexico (after World 5)
// ---------------------------------------------------------------------------
let flight = null;
const FLIGHT_LEN = 9000;
const FLIGHTS = {
  japan:  { from: 'ireland', to: 'japan', name: 'JAPAN', level: 4, hello: 'Konnichiwa, Hugo!', helloColor: '#ffb7c5' },
  mexico: { from: 'japan', to: 'mexico', name: 'MEXICO', level: 5, hello: 'Hola, Hugo!', helloColor: '#ffd166' }
};

function startFlight(key) {
  state = 'flight';
  flight = { dest: FLIGHTS[key], dist: 0, speed: 270, x: 150, y: 430, vx: 0, vy: 0, t: 0, phase: 'takeoff',
             items: [], spawnT: 2.5, coins: 0, bumps: 0, hurtT: 0, landT: 0, puffT: 0 };
  particles = [];
  popups = [];
  playMusic('flight');
  sfx.power();
}

function spawnFlightItems(f) {
  const r = Math.random(), x0 = W + 60;
  if (r < 0.5) {
    const n = 3 + Math.floor(Math.random() * 3), y0 = 90 + Math.random() * 300, wave = Math.random() < 0.5;
    for (let i = 0; i < n; i++) f.items.push({ kind: 'coin', x: x0 + i * 45, y: y0 + (wave ? Math.sin(i * 0.9) * 40 : 0), r: 14, t: 0 });
  } else if (r < 0.78) {
    f.items.push({ kind: 'storm', x: x0 + 40, y: 80 + Math.random() * 320, w: 110, h: 56, t: 0 });
  } else {
    const y0 = 90 + Math.random() * 300;
    for (let i = 0; i < 3; i++) f.items.push({ kind: 'gull', x: x0 + i * 40, y: y0 + i * 22, w: 34, h: 18, t: i, extra: 110 });
  }
}

function updateFlight(dt) {
  const f = flight;
  f.t += dt;
  f.hurtT = Math.max(0, f.hurtT - dt);
  let speedFactor = 1;
  if (f.phase === 'takeoff') {
    speedFactor = Math.min(1, f.t / 2);
    if (f.t > 1) f.y += (260 - f.y) * Math.min(1, dt * 1.5);
    if (f.t > 3) f.phase = 'fly';
  } else if (f.phase === 'fly') {
    const up = anyHeld(['ArrowUp', 'KeyW', 'Space']), down = anyHeld(['ArrowDown', 'KeyS']);
    const lr = (anyHeld(RIGHT_KEYS) ? 1 : 0) - (anyHeld(LEFT_KEYS) ? 1 : 0);
    f.vy += ((down ? 1 : 0) - (up ? 1 : 0)) * 1500 * dt;
    f.vy *= 1 - Math.min(1, dt * 4);
    f.vx += lr * 1000 * dt;
    f.vx *= 1 - Math.min(1, dt * 4);
    f.y = clamp(f.y + f.vy * dt, 70, 430);
    f.x = clamp(f.x + f.vx * dt, 80, 520);
    f.spawnT -= dt;
    if (f.spawnT <= 0 && f.dist < FLIGHT_LEN - 900) { f.spawnT = 0.7 + Math.random() * 0.5; spawnFlightItems(f); }
    if (f.dist >= FLIGHT_LEN) { f.phase = 'land'; f.landT = 0; f.items = f.items.filter(it => it.kind === 'coin'); }
  } else {
    f.landT += dt;
    speedFactor = Math.max(0, 1 - f.landT / 3.5);
    f.y += (436 - f.y) * Math.min(1, dt * 1.4);
    f.x += (W / 2 - 80 - f.x) * Math.min(1, dt);
    if (f.landT > 5) {
      flight = null;
      loadLevel(f.dest.level);
      state = 'playing';
      playMusic(def.theme);
      return;
    }
  }
  const move = f.speed * speedFactor * dt;
  f.dist += move;

  f.puffT -= dt;
  if (f.puffT <= 0 && speedFactor > 0.2) {
    f.puffT = 0.12;
    burst(f.x - 56, f.y + 2, 1, { color: 'rgba(255, 255, 255, 0.9)', speed: 30, size: 5, life: 0.6, grav: -20, angle: Math.PI, spread: 0.6 });
  }
  for (const pt of particles) pt.x -= move * 0.6;

  // Plane hit box (screen space)
  const px0 = f.x - 46, px1 = f.x + 52, py0 = f.y - 16, py1 = f.y + 16;
  for (const it of f.items) {
    it.t += dt;
    it.x -= move + (it.extra || 0) * dt;
    if (it.kind === 'gull') it.y += Math.sin(it.t * 4) * 40 * dt;
    if (it.kind === 'coin') {
      if (!it.got && Math.hypot(it.x - f.x, it.y - f.y) < 42) {
        it.got = true;
        f.coins++;
        score += 50;
        sfx.fruit();
        burst(it.x, it.y, 8, { colors: ['#fff6a5', '#ffd166'], speed: 140, size: 3, life: 0.4, grav: 0, kind: 'spark' });
      }
    } else if (f.hurtT <= 0 && it.x - it.w / 2 < px1 && it.x + it.w / 2 > px0 && it.y - it.h / 2 < py1 && it.y + it.h / 2 > py0) {
      f.hurtT = 1.2;
      f.bumps++;
      f.vy = it.y > f.y ? -320 : 320;
      score = Math.max(0, score - 50);
      sfx.hurt();
      popup(f.x, f.y - 30, 'Bump!', '#ff6b6b');
    }
  }
  f.items = f.items.filter(it => it.x > -150 && !it.got);
}

function drawFlag(x, y, w, h, country) {
  if (country === 'ireland') {
    ctx.fillStyle = '#169b62'; ctx.fillRect(x, y, w / 3, h);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + w / 3, y, w / 3, h);
    ctx.fillStyle = '#ff883e'; ctx.fillRect(x + 2 * w / 3, y, w / 3, h);
  } else if (country === 'mexico') {
    ctx.fillStyle = '#006847'; ctx.fillRect(x, y, w / 3, h);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + w / 3, y, w / 3, h);
    ctx.fillStyle = '#ce1126'; ctx.fillRect(x + 2 * w / 3, y, w / 3, h);
    ctx.fillStyle = '#8b5a2b'; circle(x + w / 2, y + h / 2, h * 0.16);
    ctx.fillStyle = '#4c9a4e'; ellipse(x + w / 2, y + h / 2 + h * 0.18, h * 0.16, h * 0.06);
  } else {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#bc002d'; circle(x + w / 2, y + h / 2, h * 0.3);
  }
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
}

function drawPlane(x, y, tilt, wheels) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  // Hugo's scarf streaming out of the cockpit
  ctx.strokeStyle = '#e63946'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(4, -18);
  for (let i = 1; i <= 5; i++) ctx.lineTo(4 - i * 7, -18 + Math.sin(time * 14 + i) * 3);
  ctx.stroke();
  // Tail
  ctx.fillStyle = '#e63946';
  ctx.beginPath(); ctx.moveTo(-44, -6); ctx.lineTo(-58, -32); ctx.lineTo(-40, -30); ctx.lineTo(-30, -6); ctx.closePath(); ctx.fill();
  // Fuselage
  const g = ctx.createLinearGradient(0, -14, 0, 14);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfd8e3');
  ctx.fillStyle = g;
  rr(-54, -13, 104, 26, 13); ctx.fill();
  ctx.fillStyle = '#3a86ff'; ctx.fillRect(-50, -2, 96, 5);
  // Hugo in the cockpit
  ctx.fillStyle = 'rgba(160, 220, 255, 0.7)';
  ctx.beginPath(); ctx.arc(6, -12, 13, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#f1c27d'; circle(6, -14, 7);
  ctx.fillStyle = '#16161d';
  ctx.beginPath(); ctx.arc(5, -16, 7.5, Math.PI, Math.PI * 2.1); ctx.fill();
  ctx.fillStyle = '#ffffff'; circle(9, -14, 1.8);
  ctx.fillStyle = '#222'; circle(9.5, -14, 1);
  // Wing
  ctx.fillStyle = '#c1121f'; ellipse(-6, 6, 30, 6);
  // Nose and propeller
  ctx.fillStyle = '#e63946'; ellipse(50, 0, 8, 10);
  ctx.fillStyle = 'rgba(80, 80, 80, 0.45)'; ellipse(58, 0, 3, 24 * Math.abs(Math.sin(time * 40)) + 4);
  ctx.fillStyle = '#444'; circle(58, 0, 3);
  if (wheels) {
    ctx.fillStyle = '#333'; circle(-10, 18, 5); circle(22, 18, 5);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-10, 16); ctx.moveTo(22, 10); ctx.lineTo(22, 16); ctx.stroke();
  }
  ctx.restore();
}

function drawFlight() {
  const f = flight;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a9be0'); g.addColorStop(0.6, '#a6d8f2'); g.addColorStop(1, '#ffe3b3');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  glow(800, 90, 150, 'rgba(255, 245, 200, 0.9)');

  // Far clouds and distant islands
  const span = W + 400;
  for (let i = 0; i < 6; i++) {
    const x = ((i * 260 - f.dist * 0.15) % span + span) % span - 200;
    drawCloud(x, 60 + (i * 47) % 140, 0.5 + (i % 3) * 0.2);
  }
  // Sea
  const sy = 470;
  const sea = ctx.createLinearGradient(0, sy, 0, H);
  sea.addColorStop(0, '#3cb4d6'); sea.addColorStop(1, '#0e4f7a');
  ctx.fillStyle = sea;
  ctx.fillRect(0, sy, W, H - sy);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const x = ((i * 90 - f.dist * 0.9) % (W + 90) + W + 90) % (W + 90) - 45, y = sy + 12 + (i % 4) * 15;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10, y - 4, x + 20, y); ctx.stroke();
  }

  // Home country at the start, the destination at the end
  const dest = f.dest;
  const startX = -f.dist + 520;
  if (startX > -200) {
    ctx.fillStyle = dest.from === 'japan' ? '#6fbf63' : '#4caf50';
    ctx.beginPath(); ctx.moveTo(-10, H); ctx.lineTo(-10, 450); ctx.quadraticCurveTo(startX - 100, 430, startX, 470); ctx.lineTo(startX + 40, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#555'; ctx.fillRect(-10, 452, startX - 40, 14);
    if (dest.from === 'japan') for (let i = 0; i < 3; i++) drawSakura(startX - 420 + i * 150, 452, 60);
    drawFlag(startX - 150, 400, 42, 26, dest.from);
  }
  const endX = FLIGHT_LEN - f.dist + 600;
  if (endX < W + 700 && dest.to === 'mexico') {
    drawPyramid(endX + 300, 452, 190);
    ctx.fillStyle = '#e9c27a';
    ctx.beginPath(); ctx.moveTo(endX - 80, H); ctx.quadraticCurveTo(endX - 40, 448, endX + 40, 450); ctx.lineTo(W + 800, 450); ctx.lineTo(W + 800, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#555'; ctx.fillRect(endX, 452, W + 800, 14);
    ctx.fillStyle = '#fff';
    for (let x = endX + 10; x < endX + W + 700; x += 60) ctx.fillRect(x, 458, 30, 3);
    for (let i = 0; i < 5; i++) drawSaguaro(endX + 120 + i * 170, 452, 70, '#3f8f4e');
    drawFlag(endX + 40, 400, 42, 28, 'mexico');
  } else if (endX < W + 700) {
    const fx = endX + 260;
    ctx.fillStyle = '#9a9cc4';
    ctx.beginPath(); ctx.moveTo(fx - 260, 470); ctx.lineTo(fx - 50, 260); ctx.lineTo(fx + 50, 260); ctx.lineTo(fx + 260, 470); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(fx - 50, 260); ctx.lineTo(fx + 50, 260); ctx.lineTo(fx + 95, 305); ctx.lineTo(fx + 40, 296); ctx.lineTo(fx, 312); ctx.lineTo(fx - 40, 296); ctx.lineTo(fx - 95, 305); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6fbf63';
    ctx.beginPath(); ctx.moveTo(endX - 80, H); ctx.quadraticCurveTo(endX - 40, 448, endX + 40, 450); ctx.lineTo(W + 800, 450); ctx.lineTo(W + 800, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#555'; ctx.fillRect(endX, 452, W + 800, 14);
    ctx.fillStyle = '#fff';
    for (let x = endX + 10; x < endX + W + 700; x += 60) ctx.fillRect(x, 458, 30, 3);
    for (let i = 0; i < 5; i++) drawSakura(endX + 120 + i * 170, 452, 70);
    drawFlag(endX + 40, 400, 42, 28, 'japan');
  }

  // Items
  for (const it of f.items) {
    if (it.kind === 'coin') {
      glow(it.x, it.y, 24, 'rgba(255, 240, 150, 0.5)');
      drawStar(it.x, it.y, 13, 6, it.t * 3, '#ffd60a');
    } else if (it.kind === 'storm') {
      ctx.fillStyle = '#6c7a89';
      for (const [dx, dy, r] of [[-35, 4, 22], [-10, -10, 28], [20, -4, 26], [42, 6, 18], [5, 10, 22]]) circle(it.x + dx, it.y + dy, r);
      if (Math.floor(it.t * 4) % 3 === 0) {
        ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(it.x, it.y + 20); ctx.lineTo(it.x - 8, it.y + 38); ctx.lineTo(it.x + 4, it.y + 38); ctx.lineTo(it.x - 4, it.y + 56); ctx.stroke();
      }
    } else {
      const flap = Math.sin(it.t * 14) * 8;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(it.x - 16, it.y - flap); ctx.quadraticCurveTo(it.x - 6, it.y - 8, it.x, it.y); ctx.quadraticCurveTo(it.x + 6, it.y - 8, it.x + 16, it.y - flap); ctx.stroke();
      ctx.fillStyle = '#ffb703'; ctx.fillRect(it.x - 9, it.y - 1, 5, 2);
    }
  }

  drawParticles(0);
  ctx.save();
  if (f.hurtT > 0 && Math.floor(time * 18) % 2) ctx.globalAlpha = 0.45;
  const tilt = f.phase === 'fly' ? clamp(f.vy * 0.0012, -0.3, 0.3) : f.phase === 'takeoff' ? (f.t > 1 ? -0.12 : 0) : 0.05;
  drawPlane(f.x, f.y, tilt, f.phase !== 'fly');
  ctx.restore();

  // HUD: journey progress
  const prog = clamp(f.dist / FLIGHT_LEN, 0, 1);
  ctx.fillStyle = 'rgba(10, 25, 40, 0.55)';
  rr(W / 2 - 250, 12, 500, 62, 12); ctx.fill();
  text(`FLYING TO ${dest.name}!`, W / 2, 28, 16, '#ffd166');
  drawFlag(W / 2 - 236, 44, 30, 20, dest.from);
  drawFlag(W / 2 + 206, 44, 30, 20, dest.to);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; ctx.fillRect(W / 2 - 196, 53, 392, 3);
  ctx.save();
  ctx.translate(W / 2 - 196 + 392 * prog, 54);
  ctx.scale(0.3, 0.3);
  drawPlane(0, 0, 0, false);
  ctx.restore();
  text(`Stars x ${f.coins}`, 24, 30, 16, '#fff', 'left');
  text(`SCORE ${String(score).padStart(6, '0')}`, W - 24, 30, 16, '#fff', 'right');

  if (f.phase === 'takeoff') {
    text(`Next stop: ${dest.name}!`, W / 2, 200, 40, '#fff');
    text('Up / Down to fly   Left / Right to speed up or slow down', W / 2, 244, 16, '#fff', 'center', 'normal');
    text('Collect the stars - dodge the storm clouds and seagulls!', W / 2, 268, 16, '#fff', 'center', 'normal');
  }
  if (f.phase === 'land' && f.landT > 2) {
    text(`Welcome to ${dest.name[0] + dest.name.slice(1).toLowerCase()}!`, W / 2, 200, 48, '#fff');
    text(dest.hello, W / 2, 252, 28, dest.helloColor);
  }
}

function drawEndScreen(title, color, rows, prompt) {
  overlay(0.55);
  text(title, W / 2, 120, 58, color);
  rows.forEach(([label, value], i) => {
    text(label, W / 2 - 20, 196 + i * 34, 19, '#cde', 'right', 'normal');
    text(value, W / 2 + 20, 196 + i * 34, 21, '#fff', 'left');
  });
  if (Math.floor(time * 2.5) % 2) text(prompt, W / 2, 196 + rows.length * 34 + 44, 22, '#fff');
}

const fmtTime = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  if (state === 'flight' && flight) {
    drawFlight();
    drawPadToast();
    ctx.restore();
    return;
  }

  const camX = Math.round(cam.x);
  drawBackground(camX);
  drawLiquid(camX);
  drawTiles(camX);
  drawHangers(camX);
  drawDecor(camX);
  drawSpikes(camX);
  drawCheckpoints(camX);
  drawGoal(camX);
  drawCrates(camX);
  drawFruits(camX);
  drawEnemies(camX);
  drawArenaGate(camX);
  drawBoss(camX);
  drawShots(camX);
  if (boomer) drawBoomerangShape(boomer.x - camX, boomer.y, boomer.ang);
  if (player && state !== 'title' && state !== 'ending') drawPlayer(camX);
  drawParticles(camX);
  drawForeground(camX);
  drawAmbient();
  drawVignette();

  if (state === 'title') drawTitle();
  else if (state === 'ending') {
    overlay(0.45);
    text('HOORAY!', W / 2, 90, 64, '#ffd166');
    text('Hugo beat Hailey, Xiav, Rian, Mrs Clohessy, the Ramen Monster', W / 2, 140, 22, '#fff');
    text('and El Taco Grande, found all six Wonder Stars', W / 2, 172, 22, '#fff');
    text('and saved Wonderland!', W / 2, 204, 22, '#fff');
    for (let i = 0; i < 6; i++) drawStar(W / 2 - 200 + i * 80, 252 + Math.sin(time * 3 + i) * 6, 20, 9, time * 2 + i, '#ffd60a');
    const demo = { facing: 1, sx: 1, sy: 1, onGround: false, vx: 0, runPhase: 0, throwT: 1, dying: false };
    drawHugo(demo, W / 2, 420 + Math.abs(Math.sin(time * 4)) * -30, 2.2);
    text(`Final score ${score}`, W / 2, 462, 22, '#fff');
    text(`Fruit ${totalFruit}    Time ${fmtTime(totalTime)}    Continues ${continues}    Best ${best}`, W / 2, 490, 16, '#cde');
    if (Math.floor(time * 2.5) % 2) text('Press Space for the title screen', W / 2, 520, 18, '#fff');
  } else {
    drawHud();
    if (state === 'paused') {
      overlay(0.5);
      text('PAUSED', W / 2, H / 2 - 20, 56, '#fff');
      text('P to resume    R to restart', W / 2, H / 2 + 30, 18, '#cde', 'center', 'normal');
    } else if (state === 'gameover') {
      drawEndScreen('GAME OVER', '#ff6b6b', [
        ['Reached', `World ${levelIndex + 1}: ${def.name}`], ['Score', String(score)], ['Best', String(best)]
      ], '');
      const opts = [`CONTINUE  (World ${levelIndex + 1}, keep score)`, 'START OVER  (World 1)'];
      opts.forEach((o, i) => {
        const y = 340 + i * 50, sel = i === goChoice;
        ctx.fillStyle = sel ? 'rgba(255, 209, 102, 0.25)' : 'rgba(255, 255, 255, 0.08)';
        rr(W / 2 - 220, y - 20, 440, 40, 10); ctx.fill();
        if (sel) { ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; rr(W / 2 - 220, y - 20, 440, 40, 10); ctx.stroke(); }
        text(o, W / 2, y, sel ? 21 : 18, sel ? '#ffd166' : '#cde');
        if (sel && Math.floor(time * 3) % 2) drawStar(W / 2 - 196, y, 10, 4.5, time * 3, '#ffd60a');
      });
      if (goT <= 0) text('Up / Down to choose    Space or A to pick', W / 2, 452, 15, '#fff', 'center', 'normal');
    } else if (state === 'complete') {
      const last = levelIndex === LEVELS.length - 1;
      drawEndScreen(`WONDER STAR ${levelIndex + 1} FOUND!`, '#ffd166', [
        ['Fruit collected', `${levelFruit} / ${level.fruits.length}`],
        ['Baddies defeated', String(levelDefeated)],
        ['Energy bonus', `+${energyBonus}`],
        ['Time', fmtTime(levelTime)],
        ['Bonus life', `+1  (lives ${lives})`],
        ['Score', String(score)]
      ], last ? 'Press Space to see the ending'
             : levelIndex === 3 ? 'Press Space to fly to Japan!'
             : levelIndex === 4 ? 'Press Space to fly to Mexico!' : `Press Space for World ${levelIndex + 2}`);
    }
  }
  drawPadToast();
  ctx.restore();
}

function drawPadToast() {
  if (padMsgT <= 0) return;
  ctx.globalAlpha = Math.min(1, padMsgT * 2);
  ctx.fillStyle = 'rgba(10, 25, 40, 0.8)';
  rr(W / 2 - 170, H - 64, 340, 40, 12); ctx.fill();
  text('Controller connected!', W / 2, H - 44, 18, '#7ed957');
  ctx.globalAlpha = 1;
}

// ===========================================================================
// Start up
// ===========================================================================
loadLevel(0);

const portrait = matchMedia('(orientation: portrait)');
const muteBtn = $('btnMute');
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  pollGamepads();
  if (portrait.matches) acc = 0;   // hold everything still until the phone is turned sideways
  muteBtn.style.opacity = muted ? 0.45 : 1;
  while (acc >= STEP) {
    update(STEP);
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
