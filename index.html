<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hugo">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Hugo's Adventures in Wonderland">
<meta property="og:description" content="Run, jump and beat the bosses across six worlds! Turn your phone sideways to play.">
<meta property="og:type" content="website">
<title>Hugo's Adventures in Wonderland</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; position: fixed; inset: 0;
               touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }

  /* Touch controls */
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #stickZone { position: absolute; left: 0; top: 18%; bottom: 0; width: 45%; pointer-events: auto; }
  #stickBase, #stickKnob { position: absolute; border-radius: 50%; pointer-events: none; display: none; }
  #stickBase { width: 120px; height: 120px; margin: -60px 0 0 -60px; background: rgba(255, 255, 255, 0.12);
               border: 3px solid rgba(255, 255, 255, 0.35); }
  #stickKnob { width: 56px; height: 56px; margin: -28px 0 0 -28px; background: rgba(255, 255, 255, 0.45); }
  #stickHint { position: absolute; left: calc(env(safe-area-inset-left) + 34px); bottom: 26px; width: 110px; height: 110px;
               border-radius: 50%; border: 3px dashed rgba(255, 255, 255, 0.3); color: rgba(255, 255, 255, 0.55);
               font: bold 13px "Trebuchet MS", sans-serif; display: flex; align-items: center; justify-content: center;
               text-align: center; pointer-events: none; }
  .tbtn { position: absolute; pointer-events: auto; border-radius: 50%; display: flex; align-items: center; justify-content: center;
          font: bold 22px "Trebuchet MS", sans-serif; color: #fff; text-shadow: 0 2px 3px rgba(0, 0, 0, 0.6);
          background: rgba(255, 255, 255, 0.18); border: 3px solid rgba(255, 255, 255, 0.45); box-sizing: border-box; }
  .tbtn.down { background: rgba(255, 255, 255, 0.42); transform: scale(0.94); }
  #btnJump { width: 92px; height: 92px; right: calc(env(safe-area-inset-right) + 22px); bottom: 26px;
             background: rgba(126, 217, 87, 0.35); border-color: rgba(126, 217, 87, 0.8); }
  #btnThrow { width: 70px; height: 70px; right: calc(env(safe-area-inset-right) + 128px); bottom: 70px; font-size: 16px;
              background: rgba(255, 209, 102, 0.3); border-color: rgba(255, 209, 102, 0.8); }
  #btnPause, #btnMute { width: 46px; height: 46px; top: calc(env(safe-area-inset-top) + 16vh); font-size: 18px; }
  #btnPause { right: calc(env(safe-area-inset-right) + 70px); }
  #btnMute { right: calc(env(safe-area-inset-right) + 14px); }

  /* Ask to turn the phone sideways */
  #rotate { position: fixed; inset: 0; background: #0b1a2c; color: #fff; display: none; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; font: bold 22px "Trebuchet MS", sans-serif; z-index: 10; }
  #rotate .phone { width: 60px; height: 100px; border: 5px solid #ffd166; border-radius: 12px; margin-bottom: 26px;
                   animation: turn 1.8s ease-in-out infinite; }
  #rotate small { display: block; margin-top: 10px; font-size: 15px; color: #9bf6ff; font-weight: normal; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>

<canvas id="game"></canvas>
<div id="touch">
  <div id="stickZone"></div>

</div>
<div id="rotate"><div class="phone"></div>Turn your phone sideways to play!<small>Hugo needs a wide screen for his adventure</small></div>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b, s = 0) =>
  a.x + s < b.x + b.w - s && a.x + a.w - s > b.x + s && a.y + s < b.y + b.h - s && a.y + a.h - s > b.y + s;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Current level data
// ===========================================================================
let levelIndex = 0, def = LEVELS[0], theme = THEMES.jungle;
let COLS = 0, LEVEL_W = 0, heights = [], ceil = [], grid = [], decor = [], hangers = [], movers = [];
let level = null;

const tileAt = (r, c) => (r < 0 || r >= ROWS || c < 0 || c >= COLS) ? 0 : grid[r][c];
const surfaceY = c => (ROWS - heights[c]) * T;

function buildWorld(d) {
  COLS = d.cols;
  LEVEL_W = COLS * T;
  heights = new Array(COLS).fill(2);
  const b = {
    setH: (a, z, h) => { for (let c = a; c <= z; c++) heights[c] = h; },
    pit: (a, z) => { for (let c = a; c <= z; c++) heights[c] = 0; }
  };
  d.terrain(b);

  // Cave ceilings
  ceil = new Array(COLS).fill(0);
  if (THEMES[d.theme].ceiling) {
    const rnd = mulberry32(31);
    for (let c = 0; c < COLS; c++) ceil[c] = 1 + (rnd() < 0.45 ? 1 : 0);
  }

  grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  for (let c = 0; c < COLS; c++) {
    for (let r = ROWS - heights[c]; r < ROWS; r++) grid[r][c] = 1;
    for (let r = 0; r < ceil[c]; r++) grid[r][c] = 1;
  }
  for (const [c, r, w] of d.ledges) for (let i = 0; i < w; i++) grid[r][c + i] = 2;

  movers = d.movers.map(([c, r, w, range, speed], i) => ({
    x: c * T, y: r * T, w: w * T, h: 20, x0: c * T, x1: (c + range) * T, speed, dir: 1, dx: 0, phase: i
  }));

  // Scenery
  decor = [];
  hangers = [];
  const rnd = mulberry32(7 + d.cols);
  const kinds = {
    jungle: ['tuft', 'tuft', 'flower', 'rock', 'mushroom'],
    cave: ['crystal', 'glowshroom', 'rock', 'crystal'],
    snow: ['snowtuft', 'icicle', 'rock', 'sapling'],
    volcano: ['rock', 'flame', 'vent', 'rock'],
    japan: ['tuft', 'pinkflower', 'lantern', 'torii', 'bamboo', 'tuft', 'pinkflower'],
    mexico: ['barrel', 'agave', 'rock', 'marigold', 'barrel', 'marigold', 'sombrero']
  }[d.theme];
  for (let c = 0; c < COLS; c++) {
    if (heights[c] && rnd() < 0.6) {
      decor.push({ kind: kinds[Math.floor(rnd() * kinds.length)], x: c * T + rnd() * T, y: surfaceY(c), s: 0.7 + rnd() * 0.6,
                   color: ['#ff5d8f', '#ffd166', '#c77dff', '#4cc9f0'][Math.floor(rnd() * 4)] });
    }
    if (ceil[c] && rnd() < 0.5) hangers.push({ x: c * T + rnd() * T, y: ceil[c] * T, len: 14 + rnd() * 34 });
  }
}

function spawnEntities(d) {
  const fruits = [], enemies = [], crates = [], spikes = [], checkpoints = [];
  const KINDS = ['apple', 'banana', 'grapes', 'melon'];
  let k = 0, goal = null;
  const fruit = (x, y) => fruits.push({ x, y, kind: KINDS[k++ % 4], taken: false, ph: (k * 1.7) % 6 });
  const SIZE = { crawler: [38, 28], hopper: [36, 28], flyer: [40, 26] };
  const b = {
    line: (c0, c1, up = 1, step = 1) => { for (let c = c0; c <= c1; c += step) fruit(c * T + T / 2, surfaceY(c) - (up - 0.5) * T); },
    at: (c, row) => fruit(c * T + T / 2, row * T + T / 2),
    arc: (c0, c1, peak) => {
      const base = surfaceY(c0);
      for (let c = c0 + 1; c < c1; c++) {
        const t = (c - c0) / (c1 - c0);
        fruit(c * T + T / 2, base - T * 0.5 - Math.sin(Math.PI * t) * peak * T);
      }
    },
    enemy: (type, c, row) => {
      const [w, h] = SIZE[type];
      const y = row !== undefined ? row * T : surfaceY(c) - h;
      enemies.push({ type, x: c * T + (T - w) / 2, y, w, h, vx: 0, vy: 0, dir: -1, t: c * 0.37,
                     alive: true, onGround: false, hitWall: false, baseY: y, active: false, hopT: 1 });
    },
    spike: c => spikes.push({ x: c * T + 3, y: surfaceY(c) - 20, w: T - 6, h: 20 }),
    crate: (c, content) => crates.push({ x: c * T + 4, y: surfaceY(c) - 38, w: 38, h: 38, content, open: false }),
    checkpoint: c => checkpoints.push({ x: c * T + 8, y: surfaceY(c) - 90, w: 30, h: 90, active: false }),
    goal: c => { goal = { x: c * T, y: surfaceY(c) - 170, w: 50, h: 170 }; }
  };
  d.entities(b);
  return { fruits, enemies, crates, spikes, checkpoints, goal };
}

let actx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
let muted = false;

function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return; }
  master = actx.createGain();
  master.gain.value = muted ? 0 : 0.7;
  master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = 0.22; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  setInterval(scheduleMusic, 25);
}

const midi = n => 440 * Math.pow(2, (n - 69) / 12);

function tone(type, f0, f1, start, dur, vol, dest) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, start);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, start + dur);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g); g.connect(dest || sfxBus);
  o.start(start); o.stop(start + dur + 0.05);
}

function noise(start, dur, vol, freq, ftype, dest) {
  if (!actx) return;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf;
  f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxBus);
  s.start(start); s.stop(start + dur + 0.05);
}

function notes(list, type, gap, dur, vol) {
  if (!actx) return;
  const t = actx.currentTime;
  list.forEach((f, i) => tone(type, f, 0, t + i * gap, dur, vol));
}

function playMusic(key) {
  song = SONGS[key] || null;
  songStep = 0;
  if (actx) nextNoteTime = actx.currentTime + 0.1;
}
function stopMusic() { song = null; }

function scheduleMusic() {
  if (!actx || !song || actx.state !== 'running') return;
  const stepDur = 60 / song.bpm / 2;
  if (nextNoteTime < actx.currentTime - 0.5) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.15) {
    playStep(song, songStep, nextNoteTime, stepDur);
    nextNoteTime += stepDur;
    songStep++;
  }
}

function playStep(s, step, t, d) {
  const i = step % 32, inBar = step % 8;
  const m = s.melody[i];
  if (m) {
    if (s.bell) {
      tone('sine', midi(m), 0, t, d * 2.5, 0.22, musicBus);
      tone('sine', midi(m + 12), 0, t, d * 1.2, 0.07, musicBus);
    } else {
      tone(s.lead, midi(m), 0, t, d * 0.9, s.lead === 'sawtooth' ? 0.09 : 0.13, musicBus);
    }
    if (s.echo) tone(s.lead, midi(m), 0, t + d * 3, d * 0.9, 0.05, musicBus);
  }
  const root = s.chords[Math.floor(i / 8)];
  if (s.drums === 'soft') {
    if (inBar % 4 === 0) tone(s.bass, midi(root), 0, t, d * 3.6, 0.22, musicBus);
    if (inBar === 0) tone('sine', 110, 50, t, 0.18, 0.25, musicBus);
    if (inBar === 4) noise(t, 0.05, 0.05, 7000, 'highpass', musicBus);
  } else {
    tone(s.bass, midi(inBar % 2 ? root + 12 : root), 0, t, d * 0.8, 0.16, musicBus);
    const kick = s.drums === 'rock' ? [0, 3, 4] : [0, 4];
    if (kick.includes(inBar)) tone('sine', 150, 45, t, 0.16, 0.35, musicBus);
    if (inBar === 2 || inBar === 6) noise(t, 0.12, 0.18, 1800, 'bandpass', musicBus);
    if (s.drums === 'rock' || inBar % 2) noise(t, 0.04, 0.06, 8000, 'highpass', musicBus);
  }
}

addEventListener('pointerup', unlockAndFullscreen, true);

// A tap on a menu screen: pick a Game Over option, start, or carry on
function menuTap(cx, cy) {
  const lx = (cx - offX) / scale, ly = (cy - offY) / scale;
  if (state === 'gameover') {
    if (goT > 0) return;
    for (let i = 0; i < 2; i++) {
      if (Math.abs(lx - W / 2) < 220 && Math.abs(ly - (340 + i * 50)) < 22) goChoice = i;
    }
    pressed.add('Enter');
  } else if (state === 'paused') pressed.add('KeyP');
  else if (state === 'title' || state === 'complete' || state === 'ending') pressed.add('Enter');
}
$('game').addEventListener('pointerdown', e => { e.preventDefault(); menuTap(e.clientX, e.clientY); });

const zone = $('stickZone');
zone.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (stick.id !== null) return;
  capture(zone, e);
  Object.assign(stick, { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0, moved: false });
  $('stickHint').style.display = 'none';
  $('stickBase').style.display = $('stickKnob').style.display = 'block';
  $('stickBase').style.left = e.clientX + 'px'; $('stickBase').style.top = e.clientY + 'px';
  drawStickKnob();
});
zone.addEventListener('pointermove', e => {
  if (e.pointerId !== stick.id) return;
  stick.dx = e.clientX - stick.ox;
  stick.dy = e.clientY - stick.oy;
  if (Math.hypot(stick.dx, stick.dy) > 14) stick.moved = true;
  drawStickKnob();
});
const stickUp = e => {
  if (e.pointerId !== stick.id) return;
  if (!stick.moved) menuTap(e.clientX, e.clientY);
  stick.id = null; stick.dx = stick.dy = 0;
  $('stickBase').style.display = $('stickKnob').style.display = 'none';
};
zone.addEventListener('pointerup', stickUp);
zone.addEventListener('pointercancel', stickUp);
function drawStickKnob() {
  const d = Math.hypot(stick.dx, stick.dy), k = d > 50 ? 50 / d : 1;
  $('stickKnob').style.left = (stick.ox + stick.dx * k) + 'px';
  $('stickKnob').style.top = (stick.oy + stick.dy * k) + 'px';
}

function holdButton(id, onDown, onUp) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); capture(el, e); el.classList.add('down'); onDown(); });
  const up = () => { el.classList.remove('down'); if (onUp) onUp(); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
holdButton('btnJump', () => { touchBtn.jump = true; }, () => { touchBtn.jump = false; });
holdButton('btnThrow', () => { touchBtn.throw = true; }, () => { touchBtn.throw = false; });
holdButton('btnPause', () => { pressed.add('KeyP'); if (state !== 'playing' && state !== 'paused') pressed.add('Enter'); });
holdButton('btnMute', () => pressed.add('KeyM'));

function touchCodes() {
  const s = new Set();
  if (stick.id !== null) {
    if (stick.dx < -20) s.add('ArrowLeft');
    if (stick.dx > 20) s.add('ArrowRight');
    // up on the stick doesn't jump (that's the JUMP button) - it's for flying and menus
    if (state !== 'playing') {
      if (stick.dy < -30) s.add('ArrowUp');
      if (stick.dy > 30) s.add('ArrowDown');
    }
  }
  if (touchBtn.jump) s.add('Space');
  if (touchBtn.throw) s.add('KeyX');
  return s;
}

// Pause when the phone locks, a call comes in or the app is switched away
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') { state = 'paused'; if (actx) actx.suspend(); }
});

function pollGamepads() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const now = touchCodes();
  for (const gp of pads) {
    if (!gp || !gp.connected) continue;
    for (const [i, codes] of PAD_MAP) if (gp.buttons[i] && gp.buttons[i].pressed) codes.forEach(c => now.add(c));
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (ax < -0.4) now.add('ArrowLeft');
    if (ax > 0.4) now.add('ArrowRight');
    if (ay < -0.5) now.add('ArrowUp');
    if (ay > 0.5) now.add('ArrowDown');
  }
  for (const c of now) {
    if (!padCodes.has(c)) {
      pressed.add(c);
      initAudio();
      if (actx && actx.state === 'suspended' && state !== 'paused') actx.resume();
    }
    held.add(c);
  }
  for (const c of padCodes) if (!now.has(c)) held.delete(c);
  padCodes = now;
}

const anyHeld = codes => codes.some(c => held.has(c));
const anyPressed = codes => codes.some(c => pressed.has(c));
const LEFT_KEYS = ['ArrowLeft', 'KeyA'];
const RIGHT_KEYS = ['ArrowRight', 'KeyD'];
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ'];
const THROW_KEYS = ['KeyX', 'KeyJ', 'ShiftLeft', 'ShiftRight'];
const START_KEYS = ['Space', 'Enter'];

// ===========================================================================
// Game state
// ===========================================================================
let state = 'title';     // title | playing | paused | gameover | complete | ending
let time = 0, levelTime = 0, totalTime = 0, score = 0, lives = START_LIVES;
let levelFruit = 0, levelDefeated = 0, totalFruit = 0, energyBonus = 0, bannerT = 0, titleMusicStarted = false;
let player = null, respawn = null, boomer = null;
let particles = [], popups = [];
const cam = { x: 0 };
let boss = null, bossShots = [];
const arena = { active: false, done: false, left: 0, fruitT: 0, goalT: 0 };

let best = 0;
try { best = Number(localStorage.getItem('hugo-wonderland-best')) || 0; } catch (e) { best = 0; }
function saveBest() {
  if (score > best) {
    best = score;
    try { localStorage.setItem('hugo-wonderland-best', String(best)); } catch (e) { /* storage unavailable */ }
  }
}

function makePlayer(x, y) {
  return { x, y, w: 26, h: 44, vx: 0, vy: 0, onGround: false, onMover: null, facing: 1, coyote: 0, jumpBuf: 0, noCut: 0,
           invuln: 0, firefly: 0, weapon: false, throwCd: 0, throwT: 0, runPhase: 0, sx: 1, sy: 1,
           energy: 100, dying: false, dieT: 0, spin: 0, dustT: 0 };
}

function loadLevel(i) {
  levelIndex = i;
  def = LEVELS[i];
  theme = THEMES[def.theme];
  buildWorld(def);
  level = spawnEntities(def);
  respawn = { x: 2 * T, y: surfaceY(2) - 44 };
  player = makePlayer(respawn.x, respawn.y);
  boomer = null;
  particles = [];
  popups = [];
  cam.x = 0;
  levelTime = 0; levelFruit = 0; levelDefeated = 0; energyBonus = 0;
  bannerT = 3;
  boss = null;
  bossShots = [];
  arena.active = false;
  arena.done = false;
  arena.goalT = 0;
  arena.left = (Math.ceil((LEVEL_W - W) / T) + 1) * T;   // the boss arena is the last screen
  resetAmbient();
}

let continues = 0, goChoice = 0, goT = 0;   // game over menu: 0 = continue, 1 = start over

function startGame() {
  score = 0; lives = START_LIVES; totalFruit = 0; totalTime = 0; continues = 0;
  loadLevel(0);
  state = 'playing';
  playMusic(def.theme);
}

// Continue: replay the world Hugo reached with a full set of lives, keeping the score
function continueGame() {
  continues++;
  lives = START_LIVES;
  loadLevel(levelIndex);
  state = 'playing';
  playMusic(def.theme);
}

// ===========================================================================
// Particles, pop-up text and ambient effects
// ===========================================================================
function burst(x, y, n, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = (o.angle ?? -Math.PI / 2) + (Math.random() - 0.5) * (o.spread ?? Math.PI * 2);
    const sp = (o.speed ?? 200) * (0.4 + Math.random() * 0.8);
    const life = (o.life ?? 0.6) * (0.6 + Math.random() * 0.6);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life,
      size: (o.size ?? 4) * (0.6 + Math.random() * 0.8),
      color: o.colors ? o.colors[Math.floor(Math.random() * o.colors.length)] : (o.color ?? '#fff'),
      grav: o.grav ?? 600, kind: o.kind ?? 'dot', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12
    });
  }
}
const popup = (x, y, text, color = '#fff') => popups.push({ x, y, text, color, life: 1.1 });

let ambient = [];
function resetAmbient() {
  const kind = theme.ambient;
  const n = kind === 'snow' ? 60 : kind === 'leaves' ? 16 : kind === 'petals' || kind === 'fiesta' ? 26 : 30;
  ambient = Array.from({ length: n }, () => newAmbient(kind, true));
}
function newAmbient(kind, anywhere) {
  const a = { kind, x: Math.random() * W, y: anywhere ? Math.random() * H : 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 3, size: 0, vx: 0, vy: 0 };
  if (kind === 'leaves' || kind === 'petals' || kind === 'fiesta') {
    const colors = kind === 'petals' ? ['#ffb7c5', '#ffc8d6', '#ff9fb8', '#ffe0ea']
                 : kind === 'fiesta' ? ['#e63946', '#ffd166', '#2ec4b6', '#c77dff']
                 : ['#7cc65a', '#a7d65f', '#e9c46a', '#5aa64a'];
    Object.assign(a, { vx: -15 - Math.random() * 25, vy: 20 + Math.random() * 25, size: kind === 'petals' ? 3 + Math.random() * 3 : 4 + Math.random() * 4,
                       color: colors[Math.floor(Math.random() * 4)] });
    if (!anywhere) a.y = -10;
  } else if (kind === 'snow') {
    Object.assign(a, { vx: -10 - Math.random() * 20, vy: 30 + Math.random() * 50, size: 1.5 + Math.random() * 2.5, color: '#fff' });
    if (!anywhere) a.y = -10;
  } else {
    const ember = kind === 'embers';
    Object.assign(a, { vx: (Math.random() - 0.5) * 20, vy: -(15 + Math.random() * 35), size: 1.5 + Math.random() * 2.5,
                       color: ember ? ['#ffb347', '#ff6b35', '#ffd166'][Math.floor(Math.random() * 3)] : ['#9bf6ff', '#c9a7ff', '#6ef0d4'][Math.floor(Math.random() * 3)] });
    if (!anywhere) a.y = H + 10;
  }
  return a;
}
function updateAmbient(dt) {
  for (let i = 0; i < ambient.length; i++) {
    const a = ambient[i];
    a.x += (a.vx + Math.sin(time * 1.5 + a.rot) * (a.kind === 'leaves' || a.kind === 'petals' || a.kind === 'fiesta' ? 20 : 8)) * dt;
    a.y += a.vy * dt;
    a.rot += a.vr * dt;
    if (a.y > H + 12 || a.y < -12) ambient[i] = newAmbient(a.kind, false);
    if (a.x < -12) a.x = W + 10;
    if (a.x > W + 12) a.x = -10;
  }
}

// ===========================================================================
// Physics
// ===========================================================================
function moveBody(b, dt) {
  b.hitWall = false;
  b.x += b.vx * dt;
  const r0 = Math.floor(b.y / T), r1 = Math.floor((b.y + b.h - 1) / T);
  if (b.vx > 0) {
    const c = Math.floor((b.x + b.w) / T);
    for (let r = r0; r <= r1; r++) {
      if (c >= COLS || tileAt(r, c) === 1) { b.x = c * T - b.w - 0.01; b.vx = 0; b.hitWall = true; break; }
    }
  } else if (b.vx < 0) {
    const c = Math.floor(b.x / T);
    for (let r = r0; r <= r1; r++) {
      if (c < 0 || tileAt(r, c) === 1) { b.x = (c + 1) * T + 0.01; b.vx = 0; b.hitWall = true; break; }
    }
  }

  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  b.onGround = false;
  const c0 = Math.floor(b.x / T), c1 = Math.floor((b.x + b.w - 1) / T);
  if (b.vy > 0) {
    const r = Math.floor((b.y + b.h) / T);
    for (let c = c0; c <= c1; c++) {
      const t = tileAt(r, c);
      if (t === 1 || (t === 2 && prevBottom <= r * T + 2)) {
        b.y = r * T - b.h; b.vy = 0; b.onGround = true; break;
      }
    }
  } else if (b.vy < 0) {
    const r = Math.floor(b.y / T);
    for (let c = c0; c <= c1; c++) {
      if (tileAt(r, c) === 1) { b.y = (r + 1) * T; b.vy = 0; break; }
    }
  }
}

function updateMovers(dt) {
  for (const m of movers) {
    const before = m.x;
    m.x += m.dir * m.speed * dt;
    if (m.x > m.x1) { m.x = m.x1; m.dir = -1; }
    if (m.x < m.x0) { m.x = m.x0; m.dir = 1; }
    m.dx = m.x - before;
  }
}

// ===========================================================================
// Player
// ===========================================================================
function hurt(from) {
  const p = player;
  if (p.invuln > 0 || p.firefly > 0 || p.dying) return;
  p.energy -= 25;
  p.invuln = 1.4;
  p.vy = -380;
  p.vx = (p.x + p.w / 2 < from.x + from.w / 2 ? -1 : 1) * 260;
  sfx.hurt();
  burst(p.x + p.w / 2, p.y + p.h / 2, 12, { colors: ['#ff6b6b', '#fff'], speed: 220, size: 3 });
  if (p.energy <= 0) die(false);
}

function die(fell) {
  const p = player;
  if (p.dying) return;
  p.dying = true;
  p.dieT = 1.6;
  p.vy = fell ? -150 : -650;
  p.vx = 0;
  boomer = null;
  if (!fell) sfx.die();
}

function loseLife() {
  lives--;
  if (lives <= 0) {
    state = 'gameover';
    goChoice = 0;
    goT = 1;
    bannerT = 0;
    stopMusic();
    sfx.over();
    saveBest();
    return;
  }
  const p = makePlayer(respawn.x, respawn.y);
  p.invuln = 2;
  player = p;
  cam.x = clamp(p.x - W * 0.4, 0, LEVEL_W - W);
  if (boss && !boss.defeated) {
    // give Hugo a moment before the boss fight carries on
    boss.mode = 'intro';
    boss.t = 1.5;
    bossShots = [];
  }
}

function killEnemy(e, stomped) {
  e.alive = false;
  levelDefeated++;
  score += 100;
  (stomped ? sfx.stomp : sfx.hit)();
  popup(e.x + e.w / 2, e.y, '+100', '#ffd166');
  burst(e.x + e.w / 2, e.y + e.h / 2, 16, { colors: ['#ffffff', '#ffd166', '#cdeac0'], speed: 240, size: 5, life: 0.5, grav: 200 });
}

function updatePlayer(dt) {
  const p = player;
  if (p.dying) {
    p.vy += G * dt;
    p.y += p.vy * dt;
    p.spin += dt * 9;
    p.dieT -= dt;
    if (p.dieT <= 0) loseLife();
    return;
  }

  // Ride moving platforms
  if (p.onMover) {
    const m = p.onMover;
    if (p.x + p.w > m.x && p.x < m.x + m.w && Math.abs(p.y + p.h - m.y) < 3) p.x += m.dx;
    else p.onMover = null;
  }

  // Running
  const dir = (anyHeld(RIGHT_KEYS) ? 1 : 0) - (anyHeld(LEFT_KEYS) ? 1 : 0);
  const icy = p.onGround && !p.onMover;
  if (dir) {
    p.vx += dir * (p.onGround ? (icy ? theme.accel : 2400) : 1500) * dt;
    p.facing = dir;
  } else if (p.onGround) {
    const f = (icy ? theme.friction : 2600) * dt;
    p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
  } else {
    p.vx *= 1 - 1.5 * dt;
  }
  p.vx = clamp(p.vx, -RUN, RUN);

  // Jumping (with coyote time, jump buffering and variable height)
  if (anyPressed(JUMP_KEYS)) p.jumpBuf = 0.12;
  p.jumpBuf -= dt;
  p.coyote = p.onGround ? 0.1 : p.coyote - dt;
  p.noCut -= dt;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -JUMP;
    p.jumpBuf = 0;
    p.coyote = 0;
    p.onMover = null;
    p.sx = 0.8; p.sy = 1.2;
    sfx.jump();
    burst(p.x + p.w / 2, p.y + p.h, 6, { color: '#e8d5b0', speed: 90, size: 4, life: 0.4, grav: -40, angle: -Math.PI / 2, spread: Math.PI });
  }
  if (!anyHeld(JUMP_KEYS) && p.vy < -260 && p.noCut <= 0) p.vy = -260;
  p.vy = Math.min(p.vy + G * dt, MAX_FALL);

  const wasGround = p.onGround, fallSpeed = p.vy, prevBottom = p.y + p.h;
  moveBody(p, dt);

  // Land on moving platforms
  if (p.vy >= 0 && !p.onGround) {
    for (const m of movers) {
      if (p.x + p.w > m.x + 2 && p.x < m.x + m.w - 2 && prevBottom <= m.y + 3 && p.y + p.h >= m.y) {
        p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.onMover = m;
        break;
      }
    }
  }

  if (!wasGround && p.onGround && fallSpeed > 350) {
    p.sx = 1.25; p.sy = 0.78;
    burst(p.x + p.w / 2, p.y + p.h, 8, { color: '#e8d5b0', speed: 110, size: 4, life: 0.45, grav: -30, angle: -Math.PI / 2, spread: Math.PI * 0.9 });
  }
  p.sx += (1 - p.sx) * Math.min(1, dt * 12);
  p.sy += (1 - p.sy) * Math.min(1, dt * 12);
  p.runPhase += Math.abs(p.vx) * dt * 0.055;
  if (p.onGround && Math.abs(p.vx) > 200) {
    p.dustT -= dt;
    if (p.dustT <= 0) {
      p.dustT = 0.12;
      burst(p.x + p.w / 2 - p.facing * 8, p.y + p.h, 1, { color: def.theme === 'snow' ? '#ffffff' : '#e8d5b0', speed: 40, size: 4, life: 0.35, grav: -50 });
    }
  }

  // Throwing
  p.throwCd -= dt;
  p.throwT -= dt;
  if (anyPressed(THROW_KEYS) && p.weapon && !boomer && p.throwCd <= 0) {
    boomer = { x: p.x + p.w / 2 + p.facing * 14, y: p.y + 16, vx: p.facing * 560, vy: -40, t: 0, ang: 0 };
    p.throwCd = 0.25;
    p.throwT = 0.2;
    sfx.throw();
  }

  // Timers and energy
  p.invuln = Math.max(0, p.invuln - dt);
  p.firefly = Math.max(0, p.firefly - dt);
  p.energy -= DRAIN * dt;
  if (p.energy <= 0) { p.energy = 0; die(false); return; }

  // Falling into water or lava
  if (p.y > H + 30) {
    if (theme.lava) {
      sfx.sizzle();
      burst(p.x + p.w / 2, H - 38, 22, { colors: ['#ffd166', '#ff6b35', '#ffffff'], speed: 300, size: 4, life: 0.8, kind: 'spark' });
    } else {
      sfx.splash();
      burst(p.x + p.w / 2, H - 38, 18, { colors: ['#bdeefa', '#ffffff', '#6fd0e6'], speed: 260, size: 4, life: 0.7 });
    }
    die(true);
    return;
  }

  // Spikes
  for (const s of level.spikes) {
    if (overlap(p, s, 4)) { hurt(s); if (!p.dying) { p.vy = -520; p.noCut = 0.25; } }
  }

  // Fruit
  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  for (const f of level.fruits) {
    if (f.taken) continue;
    if (Math.abs(f.x - pcx) < 26 && Math.abs(f.y - pcy) < 34) {
      f.taken = true;
      p.energy = Math.min(100, p.energy + 10);
      score += 50;
      levelFruit++;
      sfx.fruit();
      popup(f.x, f.y - 10, '+50', '#ffffff');
      burst(f.x, f.y, 10, { colors: ['#fff6a5', '#ffd166', '#ffffff'], speed: 160, size: 3, life: 0.5, grav: 0, kind: 'spark' });
    }
  }

  // Crates
  for (const c of level.crates) {
    if (c.open || !overlap(p, c, 2)) continue;
    c.open = true;
    score += 200;
    burst(c.x + c.w / 2, c.y + c.h / 2, 18, { colors: ['#c68642', '#8d5524', '#e0a96d'], speed: 260, size: 5, life: 0.8, kind: 'chip' });
    if (c.content === 'boomerang') { p.weapon = true; sfx.crate(); popup(c.x + c.w / 2, c.y - 10, 'BOOMERANG!  Press X', '#ffd166'); }
    else if (c.content === 'firefly') { p.firefly = 8; sfx.power(); popup(c.x + c.w / 2, c.y - 10, 'FIREFLY POWER!', '#fff6a5'); }
    else { p.energy = 100; sfx.crate(); popup(c.x + c.w / 2, c.y - 10, 'FULL ENERGY!', '#7ed957'); }
  }

  // Checkpoints
  for (const cp of level.checkpoints) {
    if (!cp.active && overlap(p, cp)) {
      cp.active = true;
      respawn = { x: cp.x, y: cp.y + cp.h - 44 };
      sfx.check();
      popup(cp.x + cp.w / 2, cp.y - 10, 'CHECKPOINT', '#7ed957');
      burst(cp.x + cp.w / 2, cp.y + 10, 20, { colors: ['#7ed957', '#ffffff', '#ffd166'], speed: 220, size: 3, kind: 'spark', grav: 100 });
    }
  }

  // Goal: the Wonder Star (appears once the boss is beaten)
  if (arena.done && arena.goalT >= 1 && overlap(p, level.goal)) {
    energyBonus = Math.floor(p.energy) * 10;
    score += energyBonus;
    totalFruit += levelFruit;
    totalTime += levelTime;
    lives = Math.min(9, lives + 1);
    state = 'complete';
    stopMusic();
    sfx.clear();
    saveBest();
  }
}

// ===========================================================================
// Enemies and the boomerang
// ===========================================================================
function updateEnemies(dt) {
  const p = player;
  for (const e of level.enemies) {
    if (!e.alive) continue;
    if (Math.abs(e.x - (cam.x + W / 2)) > W) continue;   // asleep while far off-screen
    e.t += dt;

    if (e.type === 'crawler') {
      e.vx = e.dir * 45;
      e.vy = Math.min(e.vy + G * dt, MAX_FALL);
      moveBody(e, dt);
      if (e.hitWall) e.dir *= -1;
      if (e.onGround) {
        const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
        if (!tileAt(Math.floor((e.y + e.h + 4) / T), Math.floor(fx / T))) e.dir *= -1;
      }
    } else if (e.type === 'hopper') {
      if (e.onGround) {
        e.vx = 0;
        e.hopT -= dt;
        if (e.hopT <= 0 && Math.abs(p.x - e.x) < 520) {
          e.dir = p.x + p.w / 2 < e.x + e.w / 2 ? -1 : 1;
          e.vy = -600;
          e.vx = e.dir * 150;
          e.hopT = 1.3 + Math.random() * 0.6;
        }
      }
      e.vy = Math.min(e.vy + G * dt, MAX_FALL);
      moveBody(e, dt);
    } else {
      if (!e.active && Math.abs(p.x - e.x) < 620) e.active = true;
      if (e.active) {
        e.x -= 120 * dt;
        e.y = e.baseY + Math.sin(e.t * 3) * 34;
        if (e.x < cam.x - 200) e.alive = false;
      }
    }
    if (e.y > H + 60) { e.alive = false; continue; }

    if (p.dying || !overlap(p, e, 4)) continue;
    if (p.firefly > 0) killEnemy(e, false);
    else if (p.vy > 50 && p.y + p.h - e.y < 22) {
      killEnemy(e, true);
      p.vy = -520;
      p.noCut = 0.2;
    } else hurt(e);
  }
}

function updateBoomerang(dt) {
  const b = boomer;
  if (!b) return;
  const p = player;
  b.t += dt;
  b.ang += dt * 22;
  if (b.t < 0.38) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
  } else {
    const dx = p.x + p.w / 2 - b.x, dy = p.y + 18 - b.y;
    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, dt * 6);
    b.vx += (dx / d * 640 - b.vx) * k;
    b.vy += (dy / d * 640 - b.vy) * k;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (d < 28) { boomer = null; return; }
  }
  for (const e of level.enemies) {
    if (e.alive && Math.abs(e.x + e.w / 2 - b.x) < e.w / 2 + 12 && Math.abs(e.y + e.h / 2 - b.y) < e.h / 2 + 12) killEnemy(e, false);
  }
  if (boss && !boss.defeated && Math.abs(boss.x + boss.w / 2 - b.x) < boss.w / 2 + 12 && Math.abs(boss.y + boss.h / 2 - b.y) < boss.h / 2 + 12) {
    hitBoss();
    if (b.t < 0.38) b.t = 0.38;   // bounce straight back to Hugo
  }
  for (const s of bossShots) {
    if (s.life > 0 && !(s.warn > 0) && Math.hypot(s.x - b.x, s.y - b.y) < s.r + 12) {
      s.life = 0;
      burst(s.x, s.y, 8, { color: '#ffffff', speed: 150, size: 3, life: 0.4 });
    }
  }
  if (b.t > 3) boomer = null;
}

    intro: 'Hola, Hugo! The last star is MINE!', taunt: 'Ay caramba! Have some salsa!', win: 'Muy bien, Hugo! You are the champion!' }
];
let vsT = 0;   // "HUGO VS ..." splash timer

function startBoss() {
  const spec = BOSSES[levelIndex];
  arena.active = true;
  arena.fruitT = 5;
  const x = LEVEL_W - 4 * T;
  boss = { ...spec, x, y: surfaceY(COLS - 4) - spec.h, vx: 0, vy: 0, maxHp: spec.hp, facing: -1, moveDir: -1,
           onGround: false, hitWall: false, mode: 'intro', t: 3.4, hurtT: 0, attacks: 0, phase: 0,
           say: spec.intro, sayT: 4.6, defeated: false, dizzyT: 0, throwT: 0, quizN: 0, quizT: 0, hops: 0 };
  bossShots = [];
  vsT = 2.4;
  const rx = arena.left + 40;
  respawn = { x: rx, y: surfaceY(Math.floor(rx / T)) - 44 };
  for (const e of level.enemies) if (e.x > arena.left - 60) e.alive = false;
  level.spikes = level.spikes.filter(s => s.x < arena.left - 60);
  playMusic('boss');
  sfx.boss();
}

function hitBoss() {
  const b = boss;
  if (!b || b.defeated || b.hurtT > 0 || b.mode === 'intro') return;
  b.hp--;
  b.hurtT = 0.9;
  score += 200;
  sfx.bossHit();
  popup(b.x + b.w / 2, b.y - 10, '+200', '#ffd166');
  burst(b.x + b.w / 2, b.y + b.h / 2, 18, { colors: ['#ffffff', '#ffd166', '#ff8fab'], speed: 260, size: 5, kind: 'spark', grav: 100 });
  if (b.hp <= 0) {
    b.defeated = true;
    b.dizzyT = 1.6;
    b.say = b.win;
    b.sayT = 5;
    b.vy = -300;
    bossShots = [];
    arena.done = true;
    arena.goalT = 0;
    score += 1000;
    popup(b.x + b.w / 2, b.y - 40, '+1000', '#7ed957');
    sfx.win();
    playMusic(def.theme);
  } else if (b.hp === Math.ceil(b.maxHp / 2)) {
    b.say = b.taunt;
    b.sayT = 1.8;
  }
}

function lob(kind, b, dir) {
  const p = player;
  const sx = b.x + b.w / 2 + dir * 14, sy = b.y + 14;
  if (kind === 'balloon') {
    const dx = p.x + p.w / 2 - sx;
    bossShots.push({ kind, x: sx, y: sy, vx: clamp(dx / 0.8, -480, 480), vy: -520, g: 1300, r: 11, life: 4,
                     color: Math.random() < 0.5 ? '#ff6fa8' : '#4cc9f0' });
    sfx.whoosh();
  } else if (kind === 'ball') {
    bossShots.push({ kind, x: sx, y: b.y + b.h - 14, vx: dir * 330, vy: -260, g: 1500, r: 12, life: 5, spin: 0 });
    sfx.kick();
  } else if (kind === 'plane') {
    bossShots.push({ kind, x: sx, y: p.y + 12, vx: dir * 270, vy: 0, g: 0, r: 12, life: 5, wob: Math.random() * 6 });
    sfx.whoosh();
  }
}

function sushiVolley(b, dir, n) {
  const sx = b.x + b.w / 2 + dir * 30, sy = b.y + 10;
  for (let i = 0; i < n; i++) {
    bossShots.push({ kind: 'nigiri', x: sx, y: sy, vx: dir * (180 + i * 75), vy: -640 + i * 30, g: 1300, r: 12, life: 4, spin: 0 });
  }
  sfx.whoosh();
}

function makiRoll(b, dir, n) {
  const ground = surfaceY(clamp(Math.floor((b.x + b.w / 2) / T), 0, COLS - 1));
  for (let i = 0; i < n; i++) {
    bossShots.push({ kind: 'maki', x: b.x + b.w / 2 + dir * 50, y: ground - 12, vx: dir * 250, vy: 0, g: 0, r: 12,
                     life: 5, spin: 0, delay: i * 0.5 });
  }
}

function chipFan(b, dir, n) {
  const sx = b.x + b.w / 2 + dir * 40, sy = b.y + 40;
  const aim = clamp((player.y + player.h / 2 - sy) * 0.9, -160, 160);
  for (let i = 0; i < n; i++) {
    bossShots.push({ kind: 'chip', x: sx, y: sy, vx: dir * 330, vy: aim + (i - (n - 1) / 2) * 110, g: 0, r: 11, life: 4, spin: Math.random() * 6 });
  }
  sfx.whoosh();
}

function pepperLob(b, dir, n) {
  const sx = b.x + b.w / 2 + dir * 20, sy = b.y - 10;
  for (let i = 0; i < n; i++) {
    bossShots.push({ kind: 'pepper', x: sx, y: sy, vx: dir * (170 + i * 85), vy: -680 + i * 40, g: 1300, r: 11, life: 4, spin: 0 });
  }
  sfx.whoosh();
}

function salsaWave(b) {
  const cx = b.x + b.w / 2, ground = surfaceY(clamp(Math.floor(cx / T), 0, COLS - 1));
  for (const dir of [-1, 1]) {
    bossShots.push({ kind: 'salsa', x: cx + dir * 50, y: ground - 12, vx: dir * 290, vy: 0, g: 0, r: 12, life: 4, spin: 0 });
  }
  burst(cx, ground, 16, { colors: ['#e63946', '#ff6b35', '#ffd166'], speed: 220, size: 5, life: 0.6 });
}

function dropBook(targetX) {
  const span = LEVEL_W - arena.left - 140;
  const x = targetX !== undefined ? clamp(targetX, arena.left + 40, LEVEL_W - 60) : arena.left + 60 + Math.random() * span;
  bossShots.push({ kind: 'book', x, y: -30, vx: 0, vy: 0, g: 0, r: 14, life: 4, warn: 0.8,
                   color: ['#e63946', '#3a86ff', '#2a9d8f', '#ffb703'][Math.floor(Math.random() * 4)] });
}

function endCharge(b) {
  b.mode = 'skid';
  b.t = 0.5;
  sfx.thud();
  burst(b.x + b.w / 2 + b.moveDir * 40, b.y + b.h, 10, { color: '#e8d5b0', speed: 140, size: 5, life: 0.5, grav: -40 });
}

const BOSS_AI = {
  hailey(b, dt, toward) {
    if (b.mode === 'intro') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) { b.mode = 'run'; b.t = 1.2; b.moveDir = -toward; }
    } else if (b.mode === 'run') {
      b.vx = b.moveDir * (b.hp <= 2 ? 200 : 150);
      if (b.onGround && Math.random() < dt * 0.6) b.vy = -650;
      if (b.t <= 0 && b.onGround) { b.mode = 'throw'; b.t = 0.45; b.vx = 0; }
    } else if (b.mode === 'throw') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) {
        b.throwT = 0.25;
        lob('balloon', b, toward);
        b.attacks++;
        b.mode = 'run';
        b.t = 1 + Math.random() * 0.8;
        b.moveDir = Math.random() < 0.5 ? -1 : 1;
      }
    }
  },
  xiav(b, dt, toward) {
    if (b.mode === 'intro' || b.mode === 'wag') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) { b.mode = 'bark'; b.t = 0.7; b.say = 'WOOF!'; b.sayT = 0.7; sfx.bark(); }
    } else if (b.mode === 'bark') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) {
        b.attacks++;
        if (b.attacks % 3 === 0) { b.mode = 'leap'; b.vy = -760; b.vx = toward * 280; b.t = 0.2; }
        else { b.mode = 'charge'; b.moveDir = toward; }
      }
    } else if (b.mode === 'charge') {
      b.vx = b.moveDir * (b.hp <= 3 ? 470 : 400);
      b.facing = b.moveDir;
    } else if (b.mode === 'leap') {
      if (b.t <= 0 && b.onGround) { b.mode = 'wag'; b.t = 1; b.vx = 0; sfx.thud(); }
    } else if (b.mode === 'skid') {
      b.vx *= 1 - Math.min(1, dt * 5);
      if (b.t <= 0) { b.mode = 'wag'; b.t = 0.9; }
    }
  },
  rian(b, dt, toward) {
    if (b.mode === 'intro') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) { b.mode = 'walk'; b.t = 1.2; b.moveDir = -toward; }
    } else if (b.mode === 'walk') {
      b.vx = b.moveDir * 170;
      if (b.t <= 0 && b.onGround) { b.mode = 'kick'; b.t = 0.35; b.vx = 0; }
    } else if (b.mode === 'kick') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) {
        b.attacks++;
        b.throwT = 0.25;
        lob('ball', b, toward);
        if (b.hp <= 3) setTimeout(() => { if (boss === b && !b.defeated && state === 'playing') lob('ball', b, b.facing); }, 450);
        if (b.attacks % 3 === 0) { b.mode = 'jump'; b.vy = -820; b.vx = toward * 220; b.t = 0.2; }
        else { b.mode = 'walk'; b.t = 1 + Math.random() * 0.7; b.moveDir = Math.random() < 0.5 ? -1 : 1; }
      }
    } else if (b.mode === 'jump') {
      if (b.t <= 0 && b.onGround) { b.mode = 'walk'; b.t = 0.8; b.vx = 0; sfx.thud(); }
    }
  },
  teacher(b, dt, toward) {
    const fast = b.hp <= 4;
    if (b.mode === 'intro') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) { b.mode = 'walk'; b.t = 1.4; b.moveDir = -toward; }
    } else if (b.mode === 'walk') {
      b.vx = b.moveDir * (fast ? 120 : 90);
      if (b.t <= 0) {
        b.attacks++;
        b.vx = 0;
        if (b.attacks % 3 === 0) {
          b.mode = 'quiz'; b.t = 1.6; b.quizN = fast ? 6 : 4; b.quizT = 0.3;
          b.say = 'Pop quiz!'; b.sayT = 1.2;
        } else { b.mode = 'throw'; b.t = 0.5; }
      }
    } else if (b.mode === 'throw') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) {
        b.throwT = 0.25;
        lob('plane', b, toward);
        b.mode = 'walk'; b.t = (fast ? 0.9 : 1.3) + Math.random() * 0.5; b.moveDir = Math.random() < 0.5 ? -1 : 1;
      }
    } else if (b.mode === 'quiz') {
      b.vx = 0; b.facing = toward;
      b.quizT -= dt;
      if (b.quizN > 0 && b.quizT <= 0) {
        dropBook(b.quizN % 2 ? player.x + player.w / 2 : undefined);
        b.quizN--; b.quizT = 0.28;
      }
      if (b.t <= 0) { b.mode = 'walk'; b.t = 1.2; b.moveDir = -toward; }
    }
  },
  ramen(b, dt, toward) {
    const angry = b.hp <= 5;
    if (b.mode === 'intro') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) { b.mode = 'hop'; b.t = 0.2; b.hops = 2; }
    } else if (b.mode === 'hop') {
      if (b.onGround) {
        b.vx = 0;
        if (b.t <= 0) {
          if (b.hops > 0) {
            b.hops--;
            b.vy = -520;
            b.vx = (Math.random() < 0.6 ? toward : -toward) * 170;
            b.t = 0.35;
            sfx.thud();
          } else { b.mode = 'fire'; b.t = 0.5; b.facing = toward; }
        }
      }
    } else if (b.mode === 'fire') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) {
        b.attacks++;
        b.throwT = 0.3;
        if (b.attacks % 3 === 0) makiRoll(b, toward, angry ? 4 : 3);
        else sushiVolley(b, toward, angry ? 5 : 3);
        b.mode = 'hop'; b.hops = angry ? 3 : 2; b.t = 0.7;
      }
    }
  },
  taco(b, dt, toward) {
    const angry = b.hp <= 6;
    if (b.mode === 'intro') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) { b.mode = 'walk'; b.t = 1; b.moveDir = -toward; }
    } else if (b.mode === 'walk') {
      b.vx = b.moveDir * (angry ? 150 : 110);
      if (b.t <= 0 && b.onGround) {
        b.attacks++;
        b.vx = 0;
        if (b.attacks % 3 === 0) { b.mode = 'crouch'; b.t = 0.6; b.say = 'Taco stomp!'; b.sayT = 1; }
        else if (b.attacks % 3 === 1) { b.mode = 'chips'; b.t = 0.45; }
        else { b.mode = 'peppers'; b.t = 0.45; }
      }
    } else if (b.mode === 'chips' || b.mode === 'peppers') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) {
        b.throwT = 0.3;
        if (b.mode === 'chips') chipFan(b, toward, angry ? 5 : 3);
        else pepperLob(b, toward, angry ? 4 : 3);
        b.mode = 'walk'; b.t = (angry ? 0.9 : 1.2) + Math.random() * 0.6; b.moveDir = Math.random() < 0.5 ? -1 : 1;
      }
    } else if (b.mode === 'crouch') {
      b.vx = 0; b.facing = toward;
      if (b.t <= 0) { b.mode = 'leap'; b.vy = -880; b.vx = toward * 240; b.t = 0.2; sfx.whoosh(); }
    } else if (b.mode === 'leap') {
      if (b.t <= 0 && b.onGround) {
        b.vx = 0;
        sfx.thud();
        salsaWave(b);
        b.mode = 'walk'; b.t = 1.1; b.moveDir = -toward;
      }
    }
  }
};

function updateBoss(dt) {
  const b = boss, p = player;
  b.phase += dt;
  b.hurtT = Math.max(0, b.hurtT - dt);
  b.sayT = Math.max(0, b.sayT - dt);
  b.throwT = Math.max(0, b.throwT - dt);
  b.dizzyT = Math.max(0, b.dizzyT - dt);
  const minX = arena.left + 10, maxX = LEVEL_W - b.w - 10;
  const toward = p.x + p.w / 2 < b.x + b.w / 2 ? -1 : 1;
  if (b.defeated) {
    b.vx *= 1 - Math.min(1, dt * 6);
    if (b.dizzyT <= 0) b.facing = toward;
  } else {
    b.t -= dt;
    BOSS_AI[b.kind](b, dt, toward);
    if (b.mode !== 'charge' && Math.abs(b.vx) > 20) b.facing = Math.sign(b.vx);
  }
  b.vy = Math.min(b.vy + G * dt, MAX_FALL);
  moveBody(b, dt);
  if (b.x < minX) { b.x = minX; b.moveDir = 1; if (b.mode === 'charge') endCharge(b); }
  if (b.x > maxX) { b.x = maxX; b.moveDir = -1; if (b.mode === 'charge') endCharge(b); }

  if (b.defeated || p.dying || !overlap(p, b, 6)) return;
  if (p.vy > 50 && p.y + p.h - b.y < 26) {
    hitBoss();
    p.vy = -560;
    p.noCut = 0.25;
  } else if (p.firefly > 0) {
    hitBoss();
  } else {
    hurt(b);
  }
}

function updateShots(dt) {
  const p = player;
  for (const s of bossShots) {
    if (s.delay > 0) { s.delay -= dt; continue; }
    s.life -= dt;
    if (s.kind === 'book' && s.warn > 0) {
      s.warn -= dt;
      if (s.warn <= 0) s.g = 1400;
      continue;
    }
    s.vy += s.g * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.kind === 'plane') s.y += Math.sin(time * 6 + s.wob) * 30 * dt;
    if (['ball', 'maki', 'nigiri', 'chip', 'pepper', 'salsa'].includes(s.kind)) s.spin += s.vx * dt * 0.05;
    const ground = surfaceY(clamp(Math.floor(s.x / T), 0, COLS - 1));
    if (s.y + s.r >= ground && s.vy > 0) {
      if (s.kind === 'ball') {
        s.y = ground - s.r;
        s.vy = -Math.max(380, Math.abs(s.vy) * 0.72);
      } else if (s.kind === 'pepper') {
        s.life = 0;
        sfx.sizzle();
        burst(s.x, ground - 4, 14, { colors: ['#ff6b35', '#ffd166', '#e63946'], speed: 200, size: 4, life: 0.5, kind: 'spark' });
      } else if (s.kind === 'nigiri') {
        s.life = 0;
        sfx.pop();
        burst(s.x, ground - 4, 12, { colors: ['#ffffff', '#fff6e6', '#ff8c5a'], speed: 180, size: 3, life: 0.5 });
      } else if (s.kind === 'balloon') {
        s.life = 0;
        sfx.pop();
        burst(s.x, ground - 4, 14, { colors: ['#bdeefa', '#ffffff', s.color], speed: 200, size: 3, life: 0.5 });
      } else if (s.kind === 'book') {
        s.life = 0;
        sfx.thud();
        burst(s.x, ground - 2, 8, { color: '#e8d5b0', speed: 120, size: 4, life: 0.4, grav: -40 });
      }
    }
    if (s.x < arena.left - 40 || s.x > LEVEL_W + 40) s.life = 0;
    if (s.life > 0 && !p.dying &&
        Math.abs(p.x + p.w / 2 - s.x) < p.w / 2 + s.r - 3 && Math.abs(p.y + p.h / 2 - s.y) < p.h / 2 + s.r - 3) {
      if (p.firefly > 0) s.life = 0;
      else if (p.invuln <= 0) { hurt({ x: s.x - 1, w: 2 }); s.life = 0; }
    }
  }
  bossShots = bossShots.filter(s => s.life > 0);
}

function updateArena(dt) {
  const p = player;
  if (!arena.active && !arena.done && !p.dying && p.x > arena.left + 20) startBoss();
  if (arena.active && !arena.done) {
    if (p.x < arena.left) { p.x = arena.left; if (p.vx < 0) p.vx = 0; }
    arena.fruitT -= dt;
    if (arena.fruitT <= 0) {
      // a snack falls into the arena now and then to keep Hugo's energy up
      arena.fruitT = 6;
      const fx = arena.left + 80 + Math.random() * (LEVEL_W - arena.left - 200);
      level.fruits.push({ x: fx, y: surfaceY(Math.floor(fx / T)) - 0.5 * T - (Math.random() < 0.5 ? T : 0),
                          kind: ['apple', 'banana', 'grapes', 'melon'][Math.floor(Math.random() * 4)], taken: false, ph: Math.random() * 6 });
    }
  }
  if (boss) updateBoss(dt);
  updateShots(dt);
  if (arena.done) arena.goalT = Math.min(1, arena.goalT + dt * 0.8);
}

// ===========================================================================
// Main update
// ===========================================================================
function updateEffects(dt) {
  for (const pt of particles) {
    pt.life -= dt;
    pt.vy += pt.grav * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.rot += pt.vr * dt;
  }
  particles = particles.filter(pt => pt.life > 0);
  for (const pp of popups) { pp.life -= dt; pp.y -= 40 * dt; }
  popups = popups.filter(pp => pp.life > 0);
  updateAmbient(dt);
}

function update(dt) {
  time += dt;
  padMsgT = Math.max(0, padMsgT - dt);
  updateEffects(dt);
  if (pressed.has('KeyM')) toggleMute();
  switch (state) {
    case 'title':
      cam.x = (Math.sin(time * 0.08) * 0.5 + 0.5) * 2600;
      updateMovers(dt);
      if (actx && !titleMusicStarted) { titleMusicStarted = true; playMusic('jungle'); }
      if (anyPressed(START_KEYS)) startGame();
      break;
    case 'playing': {
      if (pressed.has('KeyP')) { state = 'paused'; if (actx) actx.suspend(); break; }
      if (pressed.has('KeyR')) { startGame(); break; }
      levelTime += dt;
      bannerT = Math.max(0, bannerT - dt);
      vsT = Math.max(0, vsT - dt);
      updateMovers(dt);
      updatePlayer(dt);
      if (state !== 'playing') break;
      updateEnemies(dt);
      updateBoomerang(dt);
      updateArena(dt);
      const p = player;
      if (arena.active) {
        cam.x += (LEVEL_W - W - cam.x) * Math.min(1, dt * 4);
      } else if (!p.dying) {
        const target = p.x + p.w / 2 - W * 0.42 + p.facing * 40;
        cam.x += (target - cam.x) * Math.min(1, dt * 5);
      }
      cam.x = clamp(cam.x, 0, LEVEL_W - W);
      break;
    }
    case 'paused':
      if (pressed.has('KeyP')) { state = 'playing'; if (actx) actx.resume(); }
      else if (pressed.has('KeyR')) { if (actx) actx.resume(); startGame(); }
      break;
    case 'complete':
    case 'ending':
      updateMovers(dt);
      if (Math.random() < dt * (state === 'ending' ? 40 : 25)) {
        burst(cam.x + Math.random() * W, -10, 3, { colors: ['#ff5d8f', '#ffd166', '#4cc9f0', '#7ed957', '#c77dff'], speed: 60, size: 6, life: 3, grav: 120, kind: 'confetti', angle: Math.PI / 2, spread: 1 });
      }
      if (state === 'ending' && Math.random() < dt * 2) {
        const fx = cam.x + 100 + Math.random() * (W - 200), fy = 80 + Math.random() * 200;
        burst(fx, fy, 40, { colors: ['#ffd166', '#ff5d8f', '#9bf6ff', '#ffffff'], speed: 260, size: 3, life: 1.2, grav: 150, kind: 'spark' });
        if (actx) tone('triangle', 600 + Math.random() * 600, 200, actx.currentTime, 0.4, 0.05);
      }
      if (anyPressed(START_KEYS)) {
        if (state === 'ending') { state = 'title'; loadLevel(0); playMusic('jungle'); }
        else if (levelIndex === 3) startFlight('japan');
        else if (levelIndex === 4) startFlight('mexico');
        else if (levelIndex < LEVELS.length - 1) {
          loadLevel(levelIndex + 1);
          state = 'playing';
          playMusic(def.theme);
        } else {
          state = 'ending';
          playMusic('snow');
          saveBest();
        }
      }
      break;
    case 'gameover':
      goT = Math.max(0, goT - dt);
      if (goT > 0) break;   // a moment's pause so button-mashing doesn't skip the menu
      if (anyPressed(['ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'])) { goChoice = 1 - goChoice; sfx.jump(); }
      else if (anyPressed(['KeyC'])) continueGame();
      else if (anyPressed(['KeyN'])) startGame();
      else if (anyPressed(START_KEYS)) { if (goChoice === 0) continueGame(); else startGame(); }
      break;
    case 'flight':
      updateFlight(dt);
      break;
  }
  pressed.clear();
}

// Drawing helpers

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);   // capped so phones keep a smooth frame rate
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2;
  offY = (innerHeight - H * scale) / 2;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); ctx.fill(); }
function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 1, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
// The desktop prompts, reworded for touch screens
const TOUCH_WORDS = [
  [/^Press Space( \(or A\))? (to|for) /, 'Tap $2 '],
  [/^Up \/ Down to choose.*/, 'Tap CONTINUE or START OVER'],
  [/^Up \/ Down to fly.*/, 'Drag the stick up and down to fly - left and right to change speed'],
  [/^P to resume.*/, 'Tap the screen to carry on'],
  [/^M: (mute|sound off)$/, '']
];
function text(str, x, y, size, color, align = 'center', weight = 'bold', outline = true) {
  for (const [from, to] of TOUCH_WORDS) str = str.replace(from, to);
  if (!str) return;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(3, size * 0.16);
    ctx.strokeStyle = 'rgba(20, 30, 40, 0.85)';
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Pre-rendered tile textures, built once per world
function makeGroundTile(th, variant, topped) {
  const cv = makeCanvas(T, T), g = cv.getContext('2d');
  const rnd = mulberry32(100 + variant * 17 + (topped ? 5 : 0));
  const grad = g.createLinearGradient(0, 0, 0, T);
  grad.addColorStop(0, th.dirt[0]);
  grad.addColorStop(1, th.dirt[1]);
  g.fillStyle = grad;
  g.fillRect(0, 0, T, T);
  for (let i = 0; i < 16; i++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(0, 0, 0, 0.22)' : 'rgba(255, 255, 255, 0.12)';
    const s = 1.5 + rnd() * 3.5;
    g.beginPath(); g.ellipse(rnd() * T, rnd() * T, s, s * 0.7, rnd() * 3, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < 2; i++) {
    const x = 6 + rnd() * (T - 12), y = (topped ? 20 : 6) + rnd() * (T - (topped ? 26 : 12)), s = 3 + rnd() * 3;
    g.fillStyle = 'rgba(0, 0, 0, 0.25)'; g.beginPath(); g.ellipse(x, y, s * 1.3, s, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255, 255, 255, 0.2)'; g.beginPath(); g.ellipse(x - s * 0.4, y - s * 0.4, s * 0.5, s * 0.35, 0, 0, Math.PI * 2); g.fill();
  }
  if (th === THEMES.cave && rnd() < 0.8) {
    // glowing crystal veins
    g.fillStyle = 'rgba(155, 246, 255, 0.55)';
    const x = 8 + rnd() * 28, y = 18 + rnd() * 20;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 4, y - 7); g.lineTo(x + 8, y); g.lineTo(x + 4, y + 4); g.closePath(); g.fill();
  }
  if (th === THEMES.volcano) {
    g.strokeStyle = 'rgba(255, 120, 40, 0.45)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(rnd() * T, T); g.lineTo(rnd() * T, T * 0.6); g.lineTo(rnd() * T, T * 0.35); g.stroke();
  }
  if (topped) {
    const h = th.topH;
    const gg = g.createLinearGradient(0, 0, 0, h + 4);
    gg.addColorStop(0, th.top[0]);
    gg.addColorStop(1, th.top[1]);
    g.fillStyle = gg;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(T, 0);
    for (let x = T; x >= 0; x -= 5) g.lineTo(x, h + Math.sin(x * 0.55 + variant * 2) * 2.5 + (x % 10 === 0 ? 2.5 : 0));
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(255, 255, 255, 0.3)';
    g.fillRect(0, 0, T, 2);
    g.fillStyle = 'rgba(0, 0, 0, 0.18)';
    g.fillRect(0, h + 1, T, 2);
  }
  return cv;
}

function makeLedgeTile(th) {
  const cv = makeCanvas(T, 22), g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 22);
  grad.addColorStop(0, th.ledge[0]);
  grad.addColorStop(1, th.ledge[1]);
  g.fillStyle = grad;
  g.fillRect(0, 2, T, 18);
  g.fillStyle = 'rgba(0, 0, 0, 0.25)';
  g.fillRect(0, 18, T, 4);
  g.strokeStyle = 'rgba(0, 0, 0, 0.3)';
  g.beginPath(); g.moveTo(14, 6); g.lineTo(18, 12); g.lineTo(15, 17); g.moveTo(32, 4); g.lineTo(29, 11); g.stroke();
  g.fillStyle = th.ledge[2];
  g.beginPath(); g.moveTo(0, 0); g.lineTo(T, 0);
  for (let x = T; x >= 0; x -= 5) g.lineTo(x, 5 + Math.sin(x * 0.7) * 1.5);
  g.closePath(); g.fill();
  return cv;
}

function tilesFor(th) {
  if (!th._tiles) {
    th._tiles = {
      dirt: [0, 1, 2].map(v => makeGroundTile(th, v, false)),
      top: [0, 1, 2].map(v => makeGroundTile(th, v, true)),
      ledge: makeLedgeTile(th)
    };
  }
  return th._tiles;
}
